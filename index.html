                    </span>`
                  : `<span class="inline-flex items-center px-1.5 py-0.5 rounded-md bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 text-[10px] font-bold truncate max-w-full" title="${escapeHtml(remarkText)}">${escapeHtml(remarkText)}</span>`;

                const cardStyle = isFirst
                  ? 'bg-emerald-50/80 dark:bg-emerald-950/35 border-emerald-200 dark:border-emerald-800/70'
                  : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200/70 dark:border-slate-700/60';

                const numberStyle = isFirst
                  ? isArriving
                    ? 'text-lg sm:text-xl font-black text-emerald-700 dark:text-emerald-300'
                    : 'text-2xl sm:text-3xl font-black text-slate-900 dark:text-white'
                  : isArriving
                  ? 'text-base font-extrabold text-emerald-700 dark:text-emerald-300'
                  : 'text-xl sm:text-2xl font-extrabold text-slate-800 dark:text-slate-100';

                return `
                  <div class="rounded-xl border p-2.5 sm:p-3 flex flex-col justify-between min-h-[86px] ${cardStyle}">
                    <div class="flex items-center justify-between gap-1">
                      <span class="text-[11px] font-semibold text-slate-400 dark:text-slate-500">第 ${idx + 1} 班</span>
                      ${badgeHtml}
                    </div>
                    <div class="mt-1.5 flex items-baseline gap-0.5 tabular-nums">
                      <span class="${numberStyle} leading-none tracking-tight">${escapeHtml(countdownMain)}</span>
                      ${countdownUnit ? `<span class="text-xs font-bold text-slate-500 dark:text-slate-400">${countdownUnit}</span>` : ''}
                    </div>
                    <div class="mt-1 text-[11px] font-mono font-semibold text-slate-500 dark:text-slate-400 tabular-nums">
                      預計 ${escapeHtml(clockStr)}
                    </div>
                  </div>
                `;
              })
              .join('');

            etaBodyHtml = `<div class="mt-3 grid grid-cols-3 gap-2">${itemsHtml}</div>`;
          }

          return `
            <article class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs p-4 transition">
              <!-- 路線標頭：經典香港綠頂小巴路線牌 + 目的地 + 操作按鈕 -->
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-start gap-3 min-w-0">
                  <!-- 香港專線小巴經典綠色徽章（附頂部標誌性黃線） -->
                  <div class="shrink-0 rounded-xl overflow-hidden shadow-xs border border-emerald-800/20 min-w-[66px] text-center">
                    <div class="h-1.5 bg-gmb-roof"></div>
                    <div class="bg-gmb-green text-white px-2.5 py-1.5 font-black text-lg leading-none tracking-tight tabular-nums">
                      ${escapeHtml(route.routeCode)}
                    </div>
                  </div>

                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white leading-snug truncate">
                        ${destLabel}
                      </h3>
                      <span class="px-1.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-[10px] font-bold text-slate-500 dark:text-slate-400">
                        ${escapeHtml(route.region)}
                      </span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1 truncate" title="${stopLabel}">
                      <svg class="w-3.5 h-3.5 text-gmb-green dark:text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                      </svg>
                      <span class="truncate">${stopLabel}</span>
                    </p>
                  </div>
                </div>

                <!-- 操作列：切換車站 & 移除 -->
                <div class="flex items-center gap-1 shrink-0">
                  <button
                    type="button"
                    data-action="switch-stop"
                    data-route-id="${escapeHtml(route.id)}"
                    class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition min-h-[34px]"
                  >
                    切換車站
                  </button>
                  <button
                    type="button"
                    data-action="delete-route"
                    data-route-id="${escapeHtml(route.id)}"
                    class="w-8 h-8 rounded-xl text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/50 flex items-center justify-center transition"
                    aria-label="移除 ${escapeHtml(route.routeCode)} 路線"
                    title="移除路線"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>

              ${unmatchedWarningHtml}
              ${etaBodyHtml}
            </article>
          `;
        })
        .join('');

      container.innerHTML = cardsHtml;
    }

    /* =====================================================================
     * 7. 介面渲染：港鐵荔景站卡片（東涌線 + 荃灣線）
     * ===================================================================== */
    function renderMtrSection() {
      const container = document.getElementById('mtrCardsContainer');
      if (!container) return;

      // 更新方向篩選按鈕樣式
      const crossBtn = document.getElementById('filterCrossHarbourBtn');
      const allBtn = document.getElementById('filterAllDirBtn');
      if (crossBtn && allBtn) {
        const activeCls = 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs';
        const idleCls = 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200';
        crossBtn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition min-h-[32px] ${
          state.mtrFilter === 'cross_harbour' ? activeCls : idleCls
        }`;
        allBtn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition min-h-[32px] ${
          state.mtrFilter === 'all' ? activeCls : idleCls
        }`;
      }

      const cardsHtml = MTR_LINES_CONFIG.map((lineCfg) => {
        const lineState = state.mtrData[lineCfg.code] || { loading: true };
        const payload = lineState.payload;
        const stationBlock = payload?.data?.[lineCfg.key];
        const isDelay = payload?.isdelay === 'Y';
        const isServiceInactive = payload && Number(payload.status) === 0;

        // 延誤警告橫額
        const delayBannerHtml = isDelay
          ? `
            <div class="mx-4 mt-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-700/70 px-3.5 py-2.5 flex items-center gap-2 text-xs font-bold text-amber-800 dark:text-amber-300">
              <svg class="w-4 h-4 shrink-0 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <span>列車服務有延誤，請預留充裕出門時間</span>
            </div>
          `
          : '';

        let bodyHtml = '';

        if (lineState.loading && !payload) {
          bodyHtml = `
            <div class="p-4 space-y-2.5 animate-pulse">
              <div class="h-11 rounded-xl bg-slate-100 dark:bg-slate-800"></div>
              <div class="h-11 rounded-xl bg-slate-100 dark:bg-slate-800"></div>
              <div class="h-11 rounded-xl bg-slate-100 dark:bg-slate-800"></div>
            </div>
          `;
        } else if (lineState.error && !payload) {
          bodyHtml = `
            <div class="p-4">
              <div class="rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 p-3 flex items-center justify-between gap-3">
                <span class="text-xs font-medium text-red-700 dark:text-red-300">讀取失敗：${escapeHtml(lineState.error)}</span>
                <button type="button" data-action="retry-mtr" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white text-xs font-bold transition">重試</button>
              </div>
            </div>
          `;
        } else if (isServiceInactive) {
          bodyHtml = `
            <div class="p-5 text-center space-y-1">
              <p class="text-sm font-bold text-slate-600 dark:text-slate-300">${escapeHtml(payload.message || '暫無列車服務資料')}</p>
              <p class="text-xs text-slate-400 dark:text-slate-500">港鐵目前未提供此路線的實時班次</p>
            </div>
          `;
        } else {
          // 依篩選狀態決定顯示「只看過海」或「全部方向」
          const visibleDirs =
            state.mtrFilter === 'cross_harbour'
              ? lineCfg.directions.filter((d) => d.crossHarbour)
              : lineCfg.directions;

          const dirSectionsHtml = visibleDirs
            .map((dirCfg, dirIdx) => {
              const rawTrains = Array.isArray(stationBlock?.[dirCfg.key])
                ? stationBlock[dirCfg.key]
                : [];

              // 過濾無效班次，最多顯示 4 班車
              const trains = rawTrains
                .filter((t) => !t.valid || t.valid === 'Y')
                .slice(0, 4);

              const trainsHtml =
                trains.length === 0
                  ? `
                    <div class="rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/70 dark:border-slate-700/60 px-3 py-3 text-center text-xs font-medium text-slate-400 dark:text-slate-500">
                      暫無${escapeHtml(dirCfg.label)}列車班次
                    </div>
                  `
                  : `<div class="divide-y divide-slate-100 dark:divide-slate-800/80 rounded-xl border border-slate-200/70 dark:border-slate-800 overflow-hidden bg-slate-50/40 dark:bg-slate-800/30">
                      ${trains
                        .map((train, tIdx) => {
                          const destName = MTR_STATION_NAMES[train.dest] || train.dest || '未知';
                          const plat = train.plat || '-';
                          const clock = formatMtrTimeToHHMM(train.time);
                          const ttntStr = String(train.ttnt ?? '').trim();
                          const ttntNum = parseInt(ttntStr, 10);
                          const isArriving =
                            ttntStr === '0' ||
                            ttntStr === '-' ||
                            (!Number.isNaN(ttntNum) && ttntNum <= 0);

                          const etaHtml = isArriving
                            ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 text-xs sm:text-sm font-black">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>即將到達
                              </span>`
                            : `<div class="flex items-baseline gap-0.5 tabular-nums">
                                <span class="${
                                  tIdx === 0
                                    ? 'text-xl sm:text-2xl font-black text-slate-900 dark:text-white'
                                    : 'text-base sm:text-lg font-extrabold text-slate-700 dark:text-slate-200'
                                }">${escapeHtml(ttntStr)}</span>
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400">分鐘</span>
                              </div>`;

                          return `
                            <div class="flex items-center justify-between gap-2 px-3 py-2.5 ${
                              tIdx === 0 ? 'bg-white dark:bg-slate-900/90' : ''
                            }">
                              <div class="flex items-center gap-2.5 min-w-0">
                                <!-- 港鐵風格圓形月台編號徽章 -->
                                <span
                                  class="inline-flex items-center justify-center w-7 h-7 rounded-full text-white text-xs font-black shrink-0 shadow-xs"
                                  style="background-color: ${lineCfg.colorHex}"
                                  title="${escapeHtml(plat)}號月台"
                                >
                                  ${escapeHtml(plat)}
                                </span>
                                <div class="min-w-0">
                                  <div class="flex items-center gap-1.5">
                                    <span class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white truncate">
                                      往 ${escapeHtml(destName)}
                                    </span>
                                    <span class="text-[11px] font-semibold text-slate-400 dark:text-slate-500 shrink-0">
                                      ${escapeHtml(plat)}號月台
                                    </span>
                                  </div>
                                  <div class="text-[11px] font-mono text-slate-500 dark:text-slate-400 tabular-nums">
                                    預計 ${escapeHtml(clock)}
                                  </div>
                                </div>
                              </div>

                              <div class="shrink-0 text-right">
                                ${etaHtml}
                              </div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>`;

              return `
                <div class="${dirIdx > 0 ? 'pt-3.5 border-t border-slate-100 dark:border-slate-800' : ''}">
                  <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-extrabold text-slate-800 dark:text-slate-100">${escapeHtml(dirCfg.label)}</span>
                      <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500">${escapeHtml(dirCfg.sub)}</span>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">${dirCfg.key}</span>
                  </div>
                  ${trainsHtml}
                </div>
              `;
            })
            .join('');

          // 若本次更新失敗但仍有舊資料，顯示溫和的離線重試橫條
          const staleWarnHtml = lineState.error
            ? `<div class="mb-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 px-3 py-2 text-xs text-amber-800 dark:text-amber-300 flex items-center justify-between">
                <span>暫時無法更新：${escapeHtml(lineState.error)}</span>
                <button type="button" data-action="retry-mtr" class="underline font-bold">重試</button>
              </div>`
            : '';

          bodyHtml = `<div class="p-4 space-y-3.5">${staleWarnHtml}${dirSectionsHtml}</div>`;
        }

        const mtrSysTime = stationBlock?.curr_time
          ? formatMtrTimeToHHMM(stationBlock.curr_time)
          : '';

        return `
          <article class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs overflow-hidden">
            <!-- 港鐵路線代表色頂部橫條 -->
            <div class="px-4 py-3 text-white flex items-center justify-between" style="background-color: ${lineCfg.colorHex}">
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md bg-white/20 text-[11px] font-black tracking-wider">
                  MTR
                </span>
                <h3 class="text-base font-black tracking-wide">${escapeHtml(lineCfg.name)}</h3>
                <span class="text-xs font-semibold text-white/90">· 荔景站</span>
              </div>
              ${
                mtrSysTime
                  ? `<span class="text-[11px] font-mono font-bold bg-black/15 px-2 py-0.5 rounded-lg tabular-nums">${escapeHtml(mtrSysTime)} 更新</span>`
                  : ''
              }
            </div>

            ${delayBannerHtml}
            ${bodyHtml}
          </article>
        `;
      }).join('');

      container.innerHTML = cardsHtml;
    }

    /* =====================================================================
     * 8. 互動視窗 1：切換小巴車站 / 路線方向 / 班次類別
     * ===================================================================== */
    async function openStopSwitcherModal(routeItemId) {
      const route = state.gmbRoutes.find((r) => r.id === routeItemId);
      if (!route) return;

      const modal = document.getElementById('stopModal');
      const titleEl = document.getElementById('stopModalTitle');
      const bodyEl = document.getElementById('stopModalBody');

      titleEl.textContent = `${route.routeCode} (${route.region}) · 切換車站`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      bodyEl.innerHTML = `
        <div class="py-10 text-center space-y-2">
          <div class="w-7 h-7 border-3 border-gmb-green border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">正在讀取 ${escapeHtml(route.routeCode)} 所有方向與車站...</p>
        </div>
      `;

      state.stopModalCtx = {
        routeItemId: route.id,
        variants: [],
        selectedRouteId: route.routeId || null,
        selectedRouteSeq: route.routeSeq || 1,
        stopsCache: {},
      };

      try {
        const res = await fetchJson(
          `${API_BASE.GMB}/route/${encodeURIComponent(route.region)}/${encodeURIComponent(route.routeCode)}`
        );
        const variants = Array.isArray(res?.data) ? res.data : [];
        if (variants.length === 0) {
          throw new Error('找不到此路線的車站資料');
        }

        state.stopModalCtx.variants = variants;

        // 預選目前使用的 variant，若找不到則選第一個
        const matchedVariant =
          variants.find((v) => Number(v.route_id) === Number(route.routeId)) ||
          variants.find((v) => (v.description_tc || '').includes('正常')) ||
          variants[0];

        state.stopModalCtx.selectedRouteId = matchedVariant.route_id;

        const dirs = Array.isArray(matchedVariant.directions) ? matchedVariant.directions : [];
        const matchedDir =
          dirs.find((d) => Number(d.route_seq) === Number(route.routeSeq)) || dirs[0];
        state.stopModalCtx.selectedRouteSeq = matchedDir ? matchedDir.route_seq : 1;

        await renderStopModalContent();
      } catch (err) {
        bodyEl.innerHTML = `
          <div class="rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 p-4 text-center space-y-3">
            <p class="text-xs font-bold text-red-700 dark:text-red-300">讀取車站失敗：${escapeHtml(err.message)}</p>
            <button type="button" id="retryStopModalBtn" class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-bold">重新載入</button>
          </div>
        `;
        const retryBtn = document.getElementById('retryStopModalBtn');
        if (retryBtn) {
          retryBtn.addEventListener('click', () => openStopSwitcherModal(routeItemId));
        }
      }
    }

    async function renderStopModalContent() {
      const ctx = state.stopModalCtx;
      const bodyEl = document.getElementById('stopModalBody');
      const currentRoute = state.gmbRoutes.find((r) => r.id === ctx.routeItemId);
      if (!bodyEl || !currentRoute) return;

      const selectedVariant =
        ctx.variants.find((v) => Number(v.route_id) === Number(ctx.selectedRouteId)) ||
        ctx.variants[0];
      const directions = Array.isArray(selectedVariant?.directions)
        ? selectedVariant.directions
        : [];
      const selectedDir =
        directions.find((d) => Number(d.route_seq) === Number(ctx.selectedRouteSeq)) ||
        directions[0];

      if (!selectedVariant || !selectedDir) {
        bodyEl.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">此路線沒有可選擇的方向</p>';
        return;
      }

      ctx.selectedRouteId = selectedVariant.route_id;
      ctx.selectedRouteSeq = selectedDir.route_seq;

      // 變體選擇（若路線有特別班次／正常班次）
      const variantTabsHtml =
        ctx.variants.length > 1
          ? `
            <div>
              <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1.5">班次類別</p>
              <div class="flex flex-wrap gap-1.5">
                ${ctx.variants
                  .map((v) => {
                    const active = Number(v.route_id) === Number(ctx.selectedRouteId);
                    return `
                      <button
                        type="button"
                        data-modal-variant="${v.route_id}"
                        class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                          active
                            ? 'bg-gmb-green text-white border-gmb-green shadow-xs'
                            : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                        }"
                      >
                        ${escapeHtml(v.description_tc || `路線 #${v.route_id}`)}
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>
          `
          : '';

      // 方向選擇
      const directionTabsHtml = `
        <div>
          <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1.5">行車方向</p>
          <div class="grid grid-cols-1 gap-1.5">
            ${directions
              .map((d) => {
                const active = Number(d.route_seq) === Number(ctx.selectedRouteSeq);
                return `
                  <button
                    type="button"
                    data-modal-dir="${d.route_seq}"
                    class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-between gap-2 ${
                      active
                        ? 'bg-emerald-50 dark:bg-emerald-950/50 text-gmb-green dark:text-emerald-300 border-emerald-400 dark:border-emerald-700'
                        : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                    }"
                  >
                    <span class="truncate">${escapeHtml(d.orig_tc)} → ${escapeHtml(d.dest_tc)}</span>
                    <span class="shrink-0 text-[10px] opacity-75">方向 ${d.route_seq}</span>
                  </button>
                `;
              })
              .join('')}
          </div>
        </div>
      `;

      // 先顯示結構與車站載入中骨架
      bodyEl.innerHTML = `
        ${variantTabsHtml}
        ${directionTabsHtml}
        <div>
          <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-2">點選上車站點</p>
          <div id="modalStopsList" class="space-y-1.5">
            <div class="h-12 rounded-xl bg-slate-100 dark:bg-slate-800 animate-pulse"></div>
            <div class="h-12 rounded-xl bg-slate-100 dark:bg-slate-800 animate-pulse"></div>
            <div class="h-12 rounded-xl bg-slate-100 dark:bg-slate-800 animate-pulse"></div>
          </div>
        </div>
      `;

      // 取得該方向車站清單（含記憶體快取）
      const cacheKey = `${ctx.selectedRouteId}-${ctx.selectedRouteSeq}`;
      let stops = ctx.stopsCache[cacheKey];

      if (!stops) {
        try {
          const stopRes = await fetchJson(
            `${API_BASE.GMB}/route-stop/${ctx.selectedRouteId}/${ctx.selectedRouteSeq}`
          );
          stops = Array.isArray(stopRes?.data?.route_stops) ? stopRes.data.route_stops : [];
          ctx.stopsCache[cacheKey] = stops;
        } catch (err) {
          const listEl = document.getElementById('modalStopsList');
          if (listEl) {
            listEl.innerHTML = `<p class="text-xs text-red-600 dark:text-red-400 py-4 text-center">載入車站失敗：${escapeHtml(err.message)}</p>`;
          }
          return;
        }
      }

      const listEl = document.getElementById('modalStopsList');
      if (!listEl) return;

      if (stops.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">此方向沒有車站資料</p>';
        return;
      }

      listEl.innerHTML = stops
        .map((stop) => {
          const isCurrent =
            Number(currentRoute.routeId) === Number(ctx.selectedRouteId) &&
            Number(currentRoute.routeSeq) === Number(ctx.selectedRouteSeq) &&
            Number(currentRoute.stopSeq) === Number(stop.stop_seq);
          const nearHome = isNearQuartersStopName(stop.name_tc);

          return `
            <button
              type="button"
              data-pick-stop-seq="${stop.stop_seq}"
              data-pick-stop-id="${stop.stop_id}"
              data-pick-stop-name="${escapeHtml(stop.name_tc || stop.name_en || '')}"
              class="w-full text-left px-3.5 py-3 rounded-xl border transition flex items-center justify-between gap-2.5 ${
                isCurrent
                  ? 'bg-emerald-50 dark:bg-emerald-950/50 border-gmb-green dark:border-emerald-600 ring-1 ring-gmb-green/40'
                  : 'bg-white dark:bg-slate-800/60 border-slate-200/80 dark:border-slate-700/80 hover:border-emerald-400 dark:hover:border-emerald-700'
              }"
            >
              <div class="flex items-center gap-3 min-w-0">
                <span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-black shrink-0 ${
                  isCurrent
                    ? 'bg-gmb-green text-white'
                    : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                }">
                  ${escapeHtml(stop.stop_seq)}
                </span>
                <div class="min-w-0">
                  <div class="text-sm font-bold text-slate-900 dark:text-white truncate">
                    ${escapeHtml(stop.name_tc || stop.name_en)}
                  </div>
                  ${
                    stop.name_en
                      ? `<div class="text-[11px] text-slate-400 dark:text-slate-500 truncate">${escapeHtml(stop.name_en)}</div>`
                      : ''
                  }
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                ${
                  nearHome
                    ? '<span class="px-2 py-0.5 rounded-md bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300 text-[10px] font-bold">宿舍附近</span>'
                    : ''
                }
                ${
                  isCurrent
                    ? '<span class="px-2 py-0.5 rounded-md bg-gmb-green text-white text-[10px] font-bold">使用中</span>'
                    : ''
                }
              </div>
            </button>
          `;
        })
        .join('');
    }

    function closeStopSwitcherModal() {
      const modal = document.getElementById('stopModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    /* =====================================================================
     * 9. 互動視窗 2：新增自訂專線小巴路線
     * ===================================================================== */
    function updateAddRegionPills() {
      document.querySelectorAll('.region-option').forEach((btn) => {
        const active = btn.dataset.region === state.addRegion;
        btn.className = `region-option py-2.5 px-3 rounded-xl text-xs font-bold border transition ${
          active
            ? 'bg-gmb-green text-white border-gmb-green shadow-xs'
            : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700'
        }`;
      });
    }

    function openAddRouteModal() {
      state.addRegion = 'NT';
      updateAddRegionPills();
      const input = document.getElementById('newRouteCodeInput');
      const errEl = document.getElementById('addRouteError');
      if (input) input.value = '';
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.add('hidden');
      }
      const modal = document.getElementById('addRouteModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => input && input.focus(), 100);
    }

    function closeAddRouteModal() {
      const modal = document.getElementById('addRouteModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    async function handleAddRouteSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('newRouteCodeInput');
      const errEl = document.getElementById('addRouteError');
      const submitBtn = document.getElementById('submitAddRouteBtn');

      const region = state.addRegion;
      const routeCode = (input.value || '').trim().toUpperCase().replace(/\s+/g, '');

      if (!routeCode) {
        errEl.textContent = '請輸入小巴路線編號（例如 47M 或 407A）';
        errEl.classList.remove('hidden');
        return;
      }

      const newId = `${region}-${routeCode}`;
      if (state.gmbRoutes.some((r) => r.id === newId)) {
        errEl.textContent = `清單中已有 ${region} 區 ${routeCode} 號路線`;
        errEl.classList.remove('hidden');
        return;
      }

      errEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML =
        '<span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span><span>搜尋路線中...</span>';

      try {
        const resolved = await resolveGmbRouteMetadata({
          id: newId,
          region,
          routeCode,
        });

        state.gmbRoutes.push(resolved);
        saveGmbRoutes();
        closeAddRouteModal();
        renderGmbSection();
        fetchSingleGmbEta(state.gmbRoutes.length - 1);
        showToast(`已新增 ${routeCode}（${resolved.stopNameTc}）`, 'success');
      } catch (err) {
        errEl.textContent = err.message || '找不到該路線，請檢查地區與編號是否正確';
        errEl.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>確認新增</span>';
      }
    }

    /* =====================================================================
     * 10. 互動視窗 3：刪除路線確認
     * ===================================================================== */
    function openDeleteConfirmModal(routeId) {
      const route = state.gmbRoutes.find((r) => r.id === routeId);
      if (!route) return;
      state.pendingDeleteId = routeId;
      const msgEl = document.getElementById('deleteModalMessage');
      if (msgEl) {
        msgEl.textContent = `確定要移除 ${route.region} 區 ${route.routeCode} 號專線小巴嗎？隨時可以重新新增。`;
      }
      const modal = document.getElementById('deleteConfirmModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDeleteConfirmModal() {
      state.pendingDeleteId = null;
      const modal = document.getElementById('deleteConfirmModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    /* =====================================================================
     * 11. 全局更新排程、時鐘與深色模式
     * ===================================================================== */
    async function refreshAllData(isManual = false) {
      if (state.isRefreshing) return;
      state.isRefreshing = true;

      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        await Promise.all([fetchAllGmbEtas(), fetchAllMtrSchedules()]);
        const lastLabel = document.getElementById('lastUpdatedLabel');
        if (lastLabel) {
          lastLabel.textContent = `最後實時同步時間：${formatHkClock(new Date())} (HKT)`;
        }
        if (isManual) {
          showToast('已更新最新小巴及港鐵班次', 'success');
        }
      } finally {
        state.isRefreshing = false;
        state.countdown = REFRESH_INTERVAL_SEC;
        updateCountdownUi();
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function updateCountdownUi() {
      const textEl = document.getElementById('countdownText');
      const ringEl = document.getElementById('countdownRing');
      if (textEl) textEl.textContent = `${state.countdown}s`;
      if (ringEl) {
        const circumference = 2 * Math.PI * 8; // 50.27
        const progress = (REFRESH_INTERVAL_SEC - state.countdown) / REFRESH_INTERVAL_SEC;
        ringEl.style.strokeDashoffset = (circumference * progress).toFixed(2);
      }
    }

    function updateClockUi() {
      const clockEl = document.getElementById('hkClock');
      if (clockEl) {
        clockEl.textContent = formatHkClock(new Date());
      }
    }

    function toggleTheme() {
      const htmlEl = document.documentElement;
      const willBeDark = !htmlEl.classList.contains('dark');
      htmlEl.classList.toggle('dark', willBeDark);
      try {
        localStorage.setItem(STORAGE_KEYS.THEME, willBeDark ? 'dark' : 'light');
      } catch (e) {
        // 忽略錯誤
      }
      const meta = document.getElementById('themeColorMeta');
      if (meta) {
        meta.setAttribute('content', willBeDark ? '#020617' : '#f8fafc');
      }
    }

    /* =====================================================================
     * 12. 事件委派與初始化
     * ===================================================================== */
    function bindEvents() {
      // 頂部手動更新與深色模式
      document.getElementById('manualRefreshBtn').addEventListener('click', () => refreshAllData(true));
      document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

      // 港鐵方向快速篩選
      document.getElementById('filterCrossHarbourBtn').addEventListener('click', () => {
        state.mtrFilter = 'cross_harbour';
        writeStorage(STORAGE_KEYS.MTR_FILTER, state.mtrFilter);
        renderMtrSection();
      });
      document.getElementById('filterAllDirBtn').addEventListener('click', () => {
        state.mtrFilter = 'all';
        writeStorage(STORAGE_KEYS.MTR_FILTER, state.mtrFilter);
        renderMtrSection();
      });

      // 小巴卡片區按鈕事件委派（切換車站、移除、重試）
      document.getElementById('gmbCardsContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const routeId = btn.dataset.routeId;

        if (action === 'switch-stop') {
          openStopSwitcherModal(routeId);
        } else if (action === 'delete-route') {
          openDeleteConfirmModal(routeId);
        } else if (action === 'retry-gmb') {
          const idx = state.gmbRoutes.findIndex((r) => r.id === routeId);
          if (idx !== -1) fetchSingleGmbEta(idx);
        }
      });

      // 港鐵卡片重試按鈕委派
      document.getElementById('mtrCardsContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action="retry-mtr"]');
        if (btn) fetchAllMtrSchedules();
      });

      // 切換車站 Modal 事件
      document.getElementById('closeStopModalBtn').addEventListener('click', closeStopSwitcherModal);
      document.getElementById('stopModal').addEventListener('click', (e) => {
        if (e.target.id === 'stopModal') closeStopSwitcherModal();
      });

      document.getElementById('stopModalBody').addEventListener('click', async (e) => {
        // 切換班次變體
        const variantBtn = e.target.closest('button[data-modal-variant]');
        if (variantBtn) {
          const newVariantId = Number(variantBtn.dataset.modalVariant);
          const v = state.stopModalCtx.variants.find((item) => Number(item.route_id) === newVariantId);
          if (v) {
            state.stopModalCtx.selectedRouteId = v.route_id;
            const firstDir = Array.isArray(v.directions) && v.directions[0];
            state.stopModalCtx.selectedRouteSeq = firstDir ? firstDir.route_seq : 1;
            await renderStopModalContent();
          }
          return;
        }

        // 切換方向
        const dirBtn = e.target.closest('button[data-modal-dir]');
        if (dirBtn) {
          state.stopModalCtx.selectedRouteSeq = Number(dirBtn.dataset.modalDir);
          await renderStopModalContent();
          return;
        }

        // 選定某個車站並立即儲存 + 更新實時班次
        const stopBtn = e.target.closest('button[data-pick-stop-seq]');
        if (stopBtn) {
          const ctx = state.stopModalCtx;
          const idx = state.gmbRoutes.findIndex((r) => r.id === ctx.routeItemId);
          if (idx === -1) return;

          const variant = ctx.variants.find((v) => Number(v.route_id) === Number(ctx.selectedRouteId));
          const dir = variant?.directions?.find((d) => Number(d.route_seq) === Number(ctx.selectedRouteSeq));

          state.gmbRoutes[idx] = {
            ...state.gmbRoutes[idx],
            routeId: ctx.selectedRouteId,
            variantDesc: variant?.description_tc || '',
            routeSeq: ctx.selectedRouteSeq,
            origTc: dir?.orig_tc || '',
            destTc: dir?.dest_tc || '',
            stopSeq: Number(stopBtn.dataset.pickStopSeq),
            stopId: Number(stopBtn.dataset.pickStopId),
            stopNameTc: stopBtn.dataset.pickStopName,
            unmatchedStop: false,
            resolvedAt: Date.now(),
          };

          saveGmbRoutes();
          closeStopSwitcherModal();
          // 重置該卡片載入狀態並即時抓取新車站班次
          state.gmbLiveMap[state.gmbRoutes[idx].id] = { loading: true };
          renderGmbSection();
          fetchSingleGmbEta(idx);
          showToast(`已切換至：${stopBtn.dataset.pickStopName}`, 'success');
        }
      });

      // 新增路線 Modal 事件
      document.getElementById('openAddRouteBtn').addEventListener('click', openAddRouteModal);
      document.getElementById('closeAddRouteModalBtn').addEventListener('click', closeAddRouteModal);
      document.getElementById('cancelAddRouteBtn').addEventListener('click', closeAddRouteModal);
      document.getElementById('addRouteModal').addEventListener('click', (e) => {
        if (e.target.id === 'addRouteModal') closeAddRouteModal();
      });
      document.getElementById('addRouteForm').addEventListener('submit', handleAddRouteSubmit);

      document.querySelectorAll('.region-option').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.addRegion = btn.dataset.region;
          updateAddRegionPills();
        });
      });

      document.querySelectorAll('.quick-route-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          state.addRegion = chip.dataset.quickRegion;
          updateAddRegionPills();
          const input = document.getElementById('newRouteCodeInput');
          if (input) input.value = chip.dataset.quickCode;
        });
      });

      // 刪除確認 Modal 事件
      document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteConfirmModal);
      document.getElementById('deleteConfirmModal').addEventListener('click', (e) => {
        if (e.target.id === 'deleteConfirmModal') closeDeleteConfirmModal();
      });
      document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
        if (!state.pendingDeleteId) return;
        const removed = state.gmbRoutes.find((r) => r.id === state.pendingDeleteId);
        state.gmbRoutes = state.gmbRoutes.filter((r) => r.id !== state.pendingDeleteId);
        delete state.gmbLiveMap[state.pendingDeleteId];
        saveGmbRoutes();
        closeDeleteConfirmModal();
        renderGmbSection();
        if (removed) {
          showToast(`已移除 ${removed.routeCode} 路線`, 'info');
        }
      });

      // 手機解鎖或重新切回分頁時，自動立即更新最新班次
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          refreshAllData(false);
        }
      });
    }

    function initApp() {
      // 載入已儲存的小巴路線設定（首次使用則採用 46M、90M、91A）
      const savedRoutes = readStorage(STORAGE_KEYS.GMB_ROUTES, null);
      if (Array.isArray(savedRoutes)) {
        state.gmbRoutes = savedRoutes;
      } else {
        state.gmbRoutes = DEFAULT_GMB_ROUTES.map((r) => ({ ...r }));
        saveGmbRoutes();
      }

      // 載入港鐵方向篩選設定
      const savedFilter = readStorage(STORAGE_KEYS.MTR_FILTER, 'all');
      state.mtrFilter = savedFilter === 'cross_harbour' ? 'cross_harbour' : 'all';

      bindEvents();
      updateClockUi();
      updateCountdownUi();
      renderGmbSection();
      renderMtrSection();

      // 首次載入實時資料
      refreshAllData(false);

      // 每秒更新香港時鐘與 20 秒自動刷新倒數
      setInterval(() => {
        updateClockUi();
        if (document.visibilityState !== 'visible' || state.isRefreshing) return;

        state.countdown -= 1;
        if (state.countdown <= 0) {
          state.countdown = REFRESH_INTERVAL_SEC;
          refreshAllData(false);
        }
        updateCountdownUi();
      }, 1000);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
