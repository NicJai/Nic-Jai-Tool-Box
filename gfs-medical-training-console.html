      if (item.timeCritical) {
        const tc = item.timeCritical;
        const doneAt = state.doneInterventions[tc.intId];
        const isDone = doneAt !== undefined;
        tcHtml = `
          <div class="tc-box ${isDone ? "done" : ""}">
            <div class="tc-box-text">
              ${isDone ? `✓ ${tc.label} (@ ${fmtTime(doneAt)})` : `TIME-CRITICAL: ${tc.actionText}`}
            </div>
            <button
              type="button"
              class="tc-action-btn ${isDone ? "done" : ""}"
              data-tc-int-id="${tc.intId}"
              data-tc-label="${tc.label.replace(/"/g, "&quot;")}"
              data-tc-rubric="${tc.rubricId || ""}"
            >
              ${isDone ? "✓ Completed (Undo)" : "Mark Done"}
            </button>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="ds-top">
          <div>
            <div class="ds-kicker">${item.phaseLabel || ""}</div>
            <div class="ds-title">${item.title}</div>
          </div>
        </div>

        <div class="ds-readout">
          <div class="ds-readout-lbl">Quick Student Response</div>
          <ul class="ds-readout-list">${bulletsHtml}</ul>
          ${detailHtml}
        </div>

        ${tcHtml}
      `;
    }

    function renderTimeLog() {
      const card = document.getElementById("timeLogCard");
      if (!state.trainingCompleted) {
        card.style.display = "none";
        return;
      }

      card.style.display = "flex";
      const sc = getActiveScenario();
      const evalRes = evaluateExpectedOutcomes(sc);

      document.getElementById("logCountBadge").textContent = `${state.timeLog.length} logged`;

      const renderOutcomeItem = o => `
        <button type="button" class="outcome-row ${o.achieved ? "achieved" : "missed"}" data-outcome-id="${o.id}">
          <span class="outcome-label">${o.text}</span>
          <span class="outcome-pill ${o.achieved ? "achieved" : "missed"}">
            ${o.achieved ? "✓ Achieved" : "✗ Missed"}
          </span>
        </button>
      `;

      document.getElementById("outcomesSummaryWrap").innerHTML = `
        <div class="outcomes-box">
          <div class="outcomes-banner ${evalRes.allAchieved ? "all-ok" : "partial"}">
            <span>
              ${evalRes.allAchieved
                ? "✓ ALL EXPECTED FINDINGS & LEARNING OUTCOMES ACHIEVED"
                : `⚠ EXPECTED FINDINGS & LEARNING OUTCOMES: ${evalRes.achievedCount}/${evalRes.totalCount} ACHIEVED (${evalRes.totalCount - evalRes.achievedCount} MISSED)`}
            </span>
          </div>

          <div class="outcome-group-block">
            <div class="outcome-group-head">
              <span>Assessment</span>
              <span>${evalRes.assessmentAchieved} / ${evalRes.assessmentList.length} Achieved</span>
            </div>
            <div class="outcomes-grid">
              ${evalRes.assessmentList.map(renderOutcomeItem).join("")}
            </div>
          </div>

          <div class="outcome-group-block">
            <div class="outcome-group-head">
              <span>Intervention</span>
              <span>${evalRes.interventionAchieved} / ${evalRes.interventionList.length} Achieved</span>
            </div>
            <div class="outcomes-grid">
              ${evalRes.interventionList.map(renderOutcomeItem).join("")}
            </div>
          </div>
        </div>
      `;

      const logHtml = state.timeLog.length === 0
        ? `<div class="log-row"><span class="log-text">No items logged.</span></div>`
        : state.timeLog
            .map(entry => {
              if (entry.type === "interv") {
                return `
                  <div class="log-row">
                    <span class="log-time">${fmtTime(entry.startSec)}</span>
                    <span class="log-badge interv">Intervention</span>
                    <span class="log-text">${entry.label}</span>
                  </div>
                `;
              }
              const endStr = entry.endSec !== null ? fmtTime(entry.endSec) : fmtTime(state.timerSeconds);
              const stayVal = entry.endSec !== null ? entry.staySec : Math.max(0, state.timerSeconds - entry.startSec);
              return `
                <div class="log-row">
                  <span class="log-time">${fmtTime(entry.startSec)} → ${endStr}</span>
                  <span class="log-dur">Stayed ${fmtDuration(stayVal)}</span>
                  <span class="log-badge assess">Assessment</span>
                  <span class="log-text">${entry.label}</span>
                </div>
              `;
            })
            .join("");

      document.getElementById("timeLogList").innerHTML = logHtml;
    }

    function renderRubric() {
      const wrap = document.getElementById("rubricSectionWrap");
      if (!state.trainingCompleted) {
        wrap.style.display = "none";
        return;
      }

      wrap.style.display = "flex";
      const sc = getActiveScenario();
      const scales = [
        { key: "Excellent", cls: "sel-exc" },
        { key: "Good", cls: "sel-good" },
        { key: "Pass", cls: "sel-pass" },
        { key: "Fail", cls: "sel-fail" }
      ];

      const sectionsHtml = RUBRIC_SECTIONS.map(sec => {
        const rowsHtml = sec.items
          .map(it => {
            const current = state.rubricGrades[it.id] || "";
            const btnsHtml = scales
              .map(s => `
                <button
                  type="button"
                  class="scale-btn ${current === s.key ? s.cls : ""}"
                  data-rubric-item="${it.id}"
                  data-rubric-val="${s.key}"
                >${s.key}</button>
              `)
              .join("");

            return `
              <div class="rubric-row">
                <div class="rubric-item-text">${it.text}</div>
                <div class="scale-btns">${btnsHtml}</div>
              </div>
            `;
          })
          .join("");

        return `
          <div class="rubric-section">
            <div class="rubric-sec-head">
              <span class="rubric-sec-title">${sec.title}</span>
            </div>
            ${rowsHtml}
          </div>
        `;
      }).join("");

      const overallOptions = [
        { val: "A - Excellent", cls: "sel-exc" },
        { val: "B - Good", cls: "sel-good" },
        { val: "C - Pass", cls: "sel-pass" },
        { val: "D - Fail", cls: "sel-fail" }
      ];

      const overallHtml = overallOptions
        .map(o => `
          <button
            type="button"
            class="scale-btn ${state.overallRating === o.val ? o.cls : ""}"
            data-overall-val="${o.val}"
          >${o.val}</button>
        `)
        .join("");

      wrap.innerHTML = `
        <div class="panel-head">
          <span class="panel-title">GFS Form No. OM165 — Air Crewman Officer Training Grading Rubric</span>
        </div>

        <div class="meta-inputs">
          <input
            type="text"
            id="inpCandidateName"
            class="gs-input"
            placeholder="Candidate Name"
            value="${(state.candidateName || "").replace(/"/g, "&quot;")}"
          />
          <input
            type="date"
            id="inpEvalDate"
            class="gs-input"
            value="${state.evalDate}"
          />
        </div>

        ${sectionsHtml}

        <div class="rubric-section">
          <div class="rubric-sec-head">
            <span class="rubric-sec-title">Overall Rating &amp; Remarks (${sc.scenarioNumber || sc.title})</span>
          </div>
          <div class="rubric-row">
            <div class="rubric-item-text">Overall Rating</div>
            <div class="scale-btns">${overallHtml}</div>
          </div>
          <div style="padding: 10px 13px;">
            <textarea id="inpRemarks" class="notes-area" placeholder="Remarks...">${state.remarks || ""}</textarea>
          </div>
        </div>
      `;
    }

    function renderPrintDocument() {
      const sc = getActiveScenario();
      const evalRes = evaluateExpectedOutcomes(sc);
      const checkMark = (itemId, val) => (state.rubricGrades[itemId] === val ? "✔" : "");

      const rubricRowsHtml = RUBRIC_SECTIONS.map(sec => {
        const headerRow = `<tr class="pdf-sec-row"><td colspan="5">${sec.title}</td></tr>`;
        const itemRows = sec.items
          .map(it => `
            <tr>
              <td>${it.text}</td>
              <td class="center">${checkMark(it.id, "Excellent")}</td>
              <td class="center">${checkMark(it.id, "Good")}</td>
              <td class="center">${checkMark(it.id, "Pass")}</td>
              <td class="center">${checkMark(it.id, "Fail")}</td>
            </tr>
          `)
          .join("");
        return headerRow + itemRows;
      }).join("");

      const outcomeRowsHtml = evalRes.list
        .map(o => `
          <tr>
            <td><strong>${o.category}</strong></td>
            <td>${o.text}</td>
            <td class="center">${o.achieved ? "✔ Achieved" : "✗ Missed"}</td>
          </tr>
        `)
        .join("");

      const logRowsHtml = state.timeLog.length === 0
        ? `<tr><td colspan="4">No actions recorded.</td></tr>`
        : state.timeLog
            .map(entry => {
              if (entry.type === "interv") {
                return `
                  <tr>
                    <td>${fmtTime(entry.startSec)}</td>
                    <td>—</td>
                    <td>Intervention</td>
                    <td>${entry.label}</td>
                  </tr>
                `;
              }
              const endStr = entry.endSec !== null ? fmtTime(entry.endSec) : fmtTime(state.timerSeconds);
              const stayVal = entry.endSec !== null ? entry.staySec : Math.max(0, state.timerSeconds - entry.startSec);
              return `
                <tr>
                  <td>${fmtTime(entry.startSec)} → ${endStr}</td>
                  <td>${fmtDuration(stayVal)}</td>
                  <td>Assessment</td>
                  <td>${entry.label}</td>
                </tr>
              `;
            })
            .join("");

      document.getElementById("printDocument").innerHTML = `
        <!-- FRONT PAGE (PAGE 1): GFS FORM OM165 GRADING RUBRIC -->
        <div class="pdf-page-1">
          <div class="pdf-header">
            <div>
              <div class="pdf-title">Government Flying Service — Air Crewman Officer Training</div>
              <div class="pdf-sub">Form No.: OM165 · HRMT Assessment Grading Rubric</div>
            </div>
            <div class="pdf-sub">Page 1 of 2 (Front)</div>
          </div>

          <div class="pdf-meta-grid">
            <div><strong>Candidate:</strong> ${state.candidateName || "________________"}</div>
            <div><strong>Scenario:</strong> ${sc.scenarioNumber || sc.title}</div>
            <div><strong>Date:</strong> ${state.evalDate || "________"}</div>
            <div><strong>Total Time:</strong> ${fmtTime(state.timerSeconds)}</div>
          </div>

          <table class="pdf-table">
            <thead>
              <tr>
                <th>Assessment Component</th>
                <th class="center">Excellent</th>
                <th class="center">Good</th>
                <th class="center">Pass</th>
                <th class="center">Fail</th>
              </tr>
            </thead>
            <tbody>
              ${rubricRowsHtml}
            </tbody>
          </table>

          <div class="pdf-footer-box">
            <div style="margin-bottom: 5px;">
              <strong>Overall Rating:</strong>
              &nbsp;&nbsp;[ ${state.overallRating === "A - Excellent" ? "✔" : " "} ] A - Excellent
              &nbsp;&nbsp;[ ${state.overallRating === "B - Good" ? "✔" : " "} ] B - Good
              &nbsp;&nbsp;[ ${state.overallRating === "C - Pass" ? "✔" : " "} ] C - Pass
              &nbsp;&nbsp;[ ${state.overallRating === "D - Fail" ? "✔" : " "} ] D - Fail
            </div>
            <div><strong>Remarks:</strong> ${state.remarks || "—"}</div>
          </div>
        </div>

        <!-- BACK PAGE (PAGE 2): CHRONOLOGICAL TIME LOG & EXPECTED OUTCOMES -->
        <div class="pdf-page-2">
          <div class="pdf-header">
            <div>
              <div class="pdf-title">Chronological Time Log &amp; Expected Outcomes</div>
              <div class="pdf-sub">${sc.title} · Candidate: ${state.candidateName || "—"}</div>
            </div>
            <div class="pdf-sub">Page 2 of 2 (Back)</div>
          </div>

          <div class="pdf-outcome-summary">
            ${evalRes.allAchieved
              ? `ALL EXPECTED FINDINGS & LEARNING OUTCOMES ACHIEVED (${evalRes.achievedCount}/${evalRes.totalCount})`
              : `EXPECTED FINDINGS & LEARNING OUTCOMES: ${evalRes.achievedCount}/${evalRes.totalCount} ACHIEVED — Assessment: ${evalRes.assessmentAchieved}/${evalRes.assessmentList.length} | Intervention: ${evalRes.interventionAchieved}/${evalRes.interventionList.length}`}
          </div>

          <table class="pdf-table">
            <thead>
              <tr>
                <th style="width: 95px;">Category</th>
                <th>Expected Finding / Learning Outcome</th>
                <th class="center" style="width: 85px;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${outcomeRowsHtml}
            </tbody>
          </table>

          <table class="pdf-table">
            <thead>
              <tr>
                <th style="width: 110px;">Time Window</th>
                <th style="width: 80px;">Stay Duration</th>
                <th style="width: 90px;">Type</th>
                <th>Assessment / Intervention Detail</th>
              </tr>
            </thead>
            <tbody>
              ${logRowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderAll() {
      renderScenarioSelect();
      renderLeftPane();
      renderDetailSpotlight();
      renderTimeLog();
      renderRubric();
    }

    /* =========================================================================
       6. EVENT LISTENERS & INITIALIZATION
       ========================================================================= */
    function importScenarioFromText(rawText) {
      try {
        const parsed = JSON.parse(rawText);
        if (!parsed || !parsed.title || !Array.isArray(parsed.sequenceGroups)) {
          showToast("Invalid JSON: requires title and sequenceGroups");
          return false;
        }
        if (!parsed.id) {
          parsed.id = `custom_${Date.now()}`;
        }
        const existingIdx = state.customScenarios.findIndex(s => s.id === parsed.id);
        if (existingIdx >= 0) {
          state.customScenarios[existingIdx] = parsed;
        } else {
          state.customScenarios.push(parsed);
        }
        saveCustomScenarios(state.customScenarios);
        state.activeScenarioId = parsed.id;
        document.getElementById("jsonModal").classList.remove("open");
        resetAll();
        showToast(`Loaded: ${parsed.title}`);
        return true;
      } catch (err) {
        showToast("JSON parse error — check syntax");
        return false;
      }
    }

    document.getElementById("caseSelect").addEventListener("change", e => {
      state.activeScenarioId = e.target.value;
      resetAll();
    });

    document.getElementById("btnTimerToggle").addEventListener("click", () => {
      if (state.timerRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    document.getElementById("btnTimerReset").addEventListener("click", () => {
      const btn = document.getElementById("btnTimerReset");
      if (!state.resetPending) {
        state.resetPending = true;
        btn.textContent = "Confirm Reset";
        btn.className = "btn danger";
        clearTimeout(btn._rt);
        btn._rt = setTimeout(() => {
          state.resetPending = false;
          btn.textContent = "Reset";
          btn.className = "btn";
        }, 3000);
        return;
      }
      clearTimeout(btn._rt);
      state.resetPending = false;
      btn.textContent = "Reset";
      btn.className = "btn";
      resetAll();
      showToast("Session reset");
    });

    document.getElementById("btnStageInitial").addEventListener("click", () => {
      state.deteriorated = false;
      renderLeftPane();
    });

    document.getElementById("btnStageDeteriorate").addEventListener("click", () => {
      state.deteriorated = true;
      renderLeftPane();
    });

    document.getElementById("leftFlowScroll").addEventListener("click", e => {
      const btn = e.target.closest("[data-item-id]");
      if (!btn) return;
      selectItem(btn.getAttribute("data-item-id"));
    });

    document.getElementById("detailSpotlight").addEventListener("click", e => {
      const btn = e.target.closest("[data-tc-int-id]");
      if (!btn) return;
      toggleInterventionDone(
        btn.getAttribute("data-tc-int-id"),
        btn.getAttribute("data-tc-label"),
        btn.getAttribute("data-tc-rubric")
      );
    });

    document.getElementById("btnCompleteTraining").addEventListener("click", () => {
      finalizeCurrentItemStay();
      pauseTimer();
      state.trainingCompleted = true;
      renderAll();
      const logEl = document.getElementById("timeLogCard");
      if (logEl) {
        logEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      showToast("Training completed — Time Log & Grading Rubric ready");
    });

    document.getElementById("outcomesSummaryWrap").addEventListener("click", e => {
      const row = e.target.closest("[data-outcome-id]");
      if (!row) return;
      const oid = row.getAttribute("data-outcome-id");
      const sc = getActiveScenario();
      const evalRes = evaluateExpectedOutcomes(sc);
      const found = evalRes.list.find(x => x.id === oid);
      if (found) {
        state.outcomeOverrides[oid] = !found.achieved;
        renderTimeLog();
      }
    });

    document.getElementById("rubricSectionWrap").addEventListener("click", e => {
      const gradeBtn = e.target.closest("[data-rubric-item]");
      if (gradeBtn) {
        const itemId = gradeBtn.getAttribute("data-rubric-item");
        const val = gradeBtn.getAttribute("data-rubric-val");
        if (state.rubricGrades[itemId] === val) {
          delete state.rubricGrades[itemId];
        } else {
          state.rubricGrades[itemId] = val;
        }
        renderRubric();
        return;
      }

      const ovBtn = e.target.closest("[data-overall-val]");
      if (ovBtn) {
        const val = ovBtn.getAttribute("data-overall-val");
        state.overallRating = state.overallRating === val ? "" : val;
        renderRubric();
      }
    });

    document.getElementById("rubricSectionWrap").addEventListener("input", e => {
      if (e.target.id === "inpCandidateName") {
        state.candidateName = e.target.value;
      } else if (e.target.id === "inpEvalDate") {
        state.evalDate = e.target.value;
      } else if (e.target.id === "inpRemarks") {
        state.remarks = e.target.value;
      }
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      if (!state.trainingCompleted) {
        finalizeCurrentItemStay();
        pauseTimer();
        state.trainingCompleted = true;
        renderAll();
      }
      renderPrintDocument();
      setTimeout(() => window.print(), 80);
    });

    document.getElementById("btnJsonModal").addEventListener("click", () => {
      const sc = getActiveScenario();
      const exportObj = { ...sc };
      if (!exportObj.vitals && typeof sc.computeVitals === "function") {
        exportObj.vitals = {
          initial: sc.computeVitals({}, false),
          deteriorated: sc.computeVitals({}, true)
        };
      }
      delete exportObj.computeVitals;
      document.getElementById("jsonTextarea").value = JSON.stringify(exportObj, null, 2);
      document.getElementById("jsonModal").classList.add("open");
    });

    document.getElementById("btnCloseJson").addEventListener("click", () => {
      document.getElementById("jsonModal").classList.remove("open");
    });

    document.getElementById("jsonModal").addEventListener("click", e => {
      if (e.target.id === "jsonModal") {
        document.getElementById("jsonModal").classList.remove("open");
      }
    });

    document.getElementById("btnUploadJsonFile").addEventListener("click", () => {
      const fileInput = document.getElementById("jsonFileInput");
      fileInput.value = "";
      fileInput.click();
    });

    document.getElementById("jsonFileInput").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const content = String(ev.target.result || "");
        document.getElementById("jsonTextarea").value = content;
        importScenarioFromText(content);
      };
      reader.readAsText(file);
    });

    document.getElementById("btnCopyJson").addEventListener("click", () => {
      copyTextSafe(document.getElementById("jsonTextarea").value);
      showToast("Scenario JSON copied");
    });

    document.getElementById("btnApplyJson").addEventListener("click", () => {
      importScenarioFromText(document.getElementById("jsonTextarea").value);
    });

    // Initialize first assessment entry cleanly on load
    resetAll();
  </script>
</body>
</html>
