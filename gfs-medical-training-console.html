<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Training Console — Scenario 4: Blunt Trauma</title>
  <!--
    Medical Training Console (Offline-First Single File — iPad Optimized)
    - Strictly based on Government Flying Service (GFS) Form No. OM165.
    - High-Contrast Daylight Palette for glare-free iPad readability.
    - Left Pane: Always-readable Live Vitals + Simplified Sequential GFS OM165 Buttons.
    - Right Pane: Extra-Large Point-Form Student Response -> Time-Critical Action (below readout)
      -> Complete Training -> Chronological Time Log (Categorized Outcomes + Stay Duration) -> GFS OM165 Rubric.
    - Export PDF: 2-Page Print Layout (Front Page = GFS OM165 Rubric, Back Page = Time Log).
  -->
  <style>
    /* =========================================================================
       1. DESIGN TOKENS — HIGH-CONTRAST IPAD DAYLIGHT CLINICAL PALETTE
       ========================================================================= */
    :root {
      --bg-base: #e2e8f0;
      --bg-panel: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-input: #f1f5f9;

      --border-subtle: #cbd5e1;
      --border-mid: #94a3b8;
      --border-strong: #64748b;

      --text-primary: #0f172a;
      --text-secondary: #1e293b;
      --text-muted: #475569;
      --text-dim: #64748b;

      --cyan-bright: #0369a1;
      --cyan-bg: #e0f2fe;
      --cyan-border: #0284c7;

      --emerald: #059669;
      --emerald-bright: #047857;
      --emerald-bg: #d1fae5;
      --emerald-border: #10b981;

      --amber-bright: #b45309;
      --amber-bg: #fef3c7;
      --amber-border: #f59e0b;

      --red: #dc2626;
      --red-bright: #991b1b;
      --red-bg: #fee2e2;
      --red-border: #ef4444;

      --radius-sm: 10px;
      --radius-md: 12px;
      --radius-lg: 14px;
      --radius-pill: 9999px;

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid transparent;
      background: none;
      transition: background-color 0.13s ease, border-color 0.13s ease, transform 0.08s ease;
    }

    button:active {
      transform: scale(0.985);
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--cyan-bright);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-mid);
      border-radius: 99px;
    }

    /* =========================================================================
       2. TOP COMMAND BAR (IPAD TOUCH-FRIENDLY)
       ========================================================================= */
    .command-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 2px solid var(--border-subtle);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 240px;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: #0f172a;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .case-select {
      min-height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      flex: 1;
      min-width: 210px;
      max-width: 420px;
    }

    .utility-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      border-radius: var(--radius-md);
      padding: 3px 6px 3px 12px;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      min-width: 62px;
      text-align: center;
    }

    .timer-display.running {
      color: var(--cyan-bright);
    }

    .btn {
      min-height: 42px;
      padding: 0 13px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid var(--border-mid);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .btn.start {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-bright);
    }

    .btn.pause {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-bright);
    }

    .btn.danger {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-bright);
    }

    .btn.active-cyan {
      background: var(--cyan-bg);
      border-color: var(--cyan-border);
      color: var(--cyan-bright);
    }

    .btn.export {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    /* =========================================================================
       3. TWO-SIDED SPLIT WORKSPACE
       ========================================================================= */
    .split-workspace {
      display: grid;
      grid-template-columns: minmax(350px, 43%) minmax(420px, 57%);
      height: calc(100vh - 66px);
      width: 100%;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .split-workspace {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
    }

    .left-pane {
      background: var(--bg-panel);
      border-right: 2px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .left-pane {
        height: auto;
        border-right: none;
        border-bottom: 2px solid var(--border-mid);
      }
    }

    .right-pane {
      background: var(--bg-base);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding: 14px 16px 48px;
      gap: 14px;
    }

    @media (max-width: 900px) {
      .right-pane {
        height: auto;
        overflow-y: visible;
      }
    }

    /* =========================================================================
       4. LEFT PANE: PINNED LIVE VITALS + COMPACT SEQUENTIAL BUTTONS (NO SCROLL)
       ========================================================================= */
    .vitals-dock {
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 2px solid var(--border-subtle);
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .vitals-dock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stage-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber-bright);
    }

    .stage-label.crit {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-bright);
    }

    .stage-label.treated {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-bright);
    }

    .stage-switch-group {
      display: inline-flex;
      gap: 4px;
    }

    .stage-btn {
      min-height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
    }

    .stage-btn.active-init {
      background: var(--cyan-bg);
      border-color: var(--cyan-border);
      color: var(--cyan-bright);
    }

    .stage-btn.active-det {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-bright);
    }

    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }

    .vitals-grid-bottom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .v-box {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 4px 7px;
    }

    .v-lbl {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      line-height: 1.1;
    }

    .v-val {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 1px;
      line-height: 1.2;
    }

    .v-val.sm {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .c-emerald { color: var(--emerald-bright); }
    .c-amber { color: var(--amber-bright); }
    .c-red { color: var(--red-bright); }

    .flow-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 7px 10px 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 6px 8px;
    }

    .flow-phase-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .flow-phase-block.span-full {
      grid-column: 1 / -1;
    }

    .flow-phase-block.span-1 {
      grid-column: span 1;
    }

    @media (max-width: 480px) {
      .flow-phase-block.span-1 {
        grid-column: 1 / -1;
      }
    }

    .flow-phase-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--cyan-bright);
      padding: 0 2px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-btn-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }

    .item-btn-grid.cols-1 {
      grid-template-columns: 1fr;
    }

    .item-btn-grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 520px) {
      .item-btn-grid,
      .item-btn-grid.cols-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Compact Sequential Assessment + Time-Critical Button */
    .flow-item-btn {
      min-height: 38px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .flow-item-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-mid);
    }

    /* Red Highlight when Item Includes an Uncompleted Time-Critical Intervention */
    .flow-item-btn.time-critical {
      background: var(--red-bg);
      border-color: var(--red-border);
    }

    .flow-item-btn.time-critical:hover {
      background: #fecaca;
    }

    .flow-item-btn.time-critical .fib-name {
      color: var(--red-bright);
    }

    /* Resolved Time-Critical Intervention */
    .flow-item-btn.tc-done {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
    }

    .flow-item-btn.selected {
      box-shadow: 0 0 0 2px var(--cyan-border);
      border-color: var(--cyan-border);
    }

    .fib-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.18;
    }

    .fib-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .fib-badge.done {
      background: #ffffff;
      border-color: var(--emerald-border);
      color: var(--emerald-bright);
    }

    .fib-badge.active-now {
      background: var(--cyan-bg);
      border-color: var(--cyan-border);
      color: var(--cyan-bright);
    }

    .fib-badge.crit {
      background: var(--red);
      border-color: var(--red-bright);
      color: #ffffff;
    }

    /* =========================================================================
       5. RIGHT PANE: SELECTED ITEM DETAIL CARD (READOUT FIRST -> TC BELOW)
       ========================================================================= */
    .detail-spotlight {
      background: #ffffff;
      border: 2px solid var(--cyan-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .ds-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ds-kicker {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--cyan-bright);
    }

    .ds-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .ds-readout {
      background: var(--bg-panel);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ds-readout-lbl {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .ds-readout-list {
      margin: 0;
      padding-left: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: clamp(24px, 2.6vw, 32px);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.38;
    }

    .ds-readout-list li::marker {
      color: var(--cyan-bright);
    }

    .ds-readout-detail {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.55;
      padding-top: 12px;
      border-top: 1px dashed var(--border-mid);
    }

    /* Time-Critical Action Box Placed Below Quick Student Response */
    .tc-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--red-bg);
      border: 1.5px solid var(--red-border);
      border-left: 5px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .tc-box.done {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      border-left-color: var(--emerald);
    }

    .tc-box-text {
      font-size: 14px;
      font-weight: 800;
      color: var(--red-bright);
      flex: 1;
      min-width: 210px;
      line-height: 1.35;
    }

    .tc-box.done .tc-box-text {
      color: var(--emerald-bright);
    }

    .tc-action-btn {
      min-height: 44px;
      padding: 0 15px;
      border-radius: var(--radius-sm);
      background: var(--red);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(185, 28, 28, 0.25);
    }

    .tc-action-btn.done {
      background: #ffffff;
      border: 1.5px solid var(--emerald-border);
      color: var(--emerald-bright);
      box-shadow: none;
    }

    /* =========================================================================
       6. RIGHT PANE: CHRONOLOGICAL TIME LOG (STAY DURATION + INTERVENTIONS)
       ========================================================================= */
    .panel-card {
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--cyan-bright);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 290px;
      overflow-y: auto;
    }

    .log-list.expanded {
      max-height: none;
    }

    .log-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      font-size: 13.5px;
      flex-wrap: wrap;
    }

    .log-time {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      color: var(--cyan-bright);
      flex-shrink: 0;
    }

    .log-dur {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      background: #ffffff;
      border: 1px solid var(--border-mid);
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .log-badge {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .log-badge.assess {
      background: var(--cyan-bg);
      border: 1px solid var(--cyan-border);
      color: var(--cyan-bright);
    }

    .log-badge.interv {
      background: var(--emerald-bg);
      border: 1px solid var(--emerald-border);
      color: var(--emerald-bright);
    }

    .log-text {
      color: var(--text-primary);
      font-weight: 700;
      flex: 1;
      min-width: 150px;
    }

    /* Expected Findings & Learning Outcomes Summary inside Time Log */
    .outcomes-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-panel);
      border: 1.5px solid var(--border-subtle);
    }

    .outcomes-banner {
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .outcomes-banner.all-ok {
      background: var(--emerald-bg);
      border: 1.5px solid var(--emerald-border);
      color: var(--emerald-bright);
    }

    .outcomes-banner.partial {
      background: var(--amber-bg);
      border: 1.5px solid var(--amber-border);
      color: var(--amber-bright);
    }

    .outcomes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .outcome-group-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }

    .outcome-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--cyan-bright);
      padding: 4px 6px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
    }

    @media (max-width: 680px) {
      .outcomes-grid {
        grid-template-columns: 1fr;
      }
    }

    .outcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      text-align: left;
      font-size: 12.5px;
    }

    .outcome-row:hover {
      border-color: var(--border-strong);
    }

    .outcome-row.achieved {
      border-left: 4px solid var(--emerald);
    }

    .outcome-row.missed {
      border-left: 4px solid var(--red);
      background: #fffafa;
    }

    .outcome-label {
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      flex: 1;
    }

    .outcome-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .outcome-pill.achieved {
      background: var(--emerald-bg);
      color: var(--emerald-bright);
      border: 1px solid var(--emerald-border);
    }

    .outcome-pill.missed {
      background: var(--red-bg);
      color: var(--red-bright);
      border: 1px solid var(--red-border);
    }

    .complete-bar {
      display: flex;
      justify-content: flex-end;
    }

    .btn-complete-run {
      min-height: 48px;
      padding: 0 22px;
      border-radius: var(--radius-md);
      background: var(--emerald);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-complete-run:hover {
      background: var(--emerald-bright);
    }

    /* =========================================================================
       7. END-OF-TRAINING GFS FORM OM165 GRADING RUBRIC
       ========================================================================= */
    .rubric-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 2px solid var(--emerald-border);
      padding-top: 14px;
    }

    .meta-inputs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 540px) {
      .meta-inputs {
        grid-template-columns: 1fr;
      }
    }

    .gs-input {
      min-height: 42px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
    }

    .rubric-section {
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .rubric-sec-head {
      padding: 9px 13px;
      background: #f1f5f9;
      border-bottom: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rubric-sec-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--cyan-bright);
      letter-spacing: 0.02em;
    }

    .rubric-row {
      padding: 9px 13px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .rubric-row:last-child {
      border-bottom: none;
    }

    .rubric-item-text {
      flex: 1;
      min-width: 210px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .scale-btns {
      display: inline-flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .scale-btn {
      min-height: 38px;
      padding: 0 11px;
      border-radius: 7px;
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .scale-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .scale-btn.sel-exc {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-bright);
    }

    .scale-btn.sel-good {
      background: var(--cyan-bg);
      border-color: var(--cyan-border);
      color: var(--cyan-bright);
    }

    .scale-btn.sel-pass {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-bright);
    }

    .scale-btn.sel-fail {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-bright);
    }

    .notes-area {
      width: 100%;
      min-height: 82px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-primary);
      font-size: 14px;
      resize: vertical;
    }

    /* =========================================================================
       8. MODAL & TOAST
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      background: #ffffff;
      border: 1.5px solid var(--border-mid);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      padding: 13px 16px;
      border-bottom: 1.5px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .json-editor {
      width: 100%;
      min-height: 240px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-panel);
      border: 1.5px solid var(--border-mid);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12.5px;
      resize: vertical;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 90;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================================================================
       9. TWO-PAGE PDF PRINT STYLESHEET
          FRONT PAGE (PAGE 1): GFS FORM OM165 GRADING RUBRIC
          BACK PAGE  (PAGE 2): CHRONOLOGICAL TIME LOG & EXPECTED OUTCOMES
       ========================================================================= */
    .print-only-doc {
      display: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 12mm;
      }

      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
        font-size: 10pt !important;
      }

      .command-bar,
      .split-workspace,
      .modal-backdrop,
      .toast {
        display: none !important;
      }

      .print-only-doc {
        display: block !important;
        width: 100%;
        background: #ffffff;
        color: #0f172a;
      }

      .pdf-page-1 {
        page-break-after: always;
        break-after: page;
      }

      .pdf-page-2 {
        page-break-before: always;
        break-before: page;
      }

      .pdf-header {
        border-bottom: 2px solid #0f172a;
        padding-bottom: 6px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .pdf-title {
        font-size: 13pt;
        font-weight: 800;
        color: #0f172a;
      }

      .pdf-sub {
        font-size: 9pt;
        color: #334155;
        font-weight: 600;
      }

      .pdf-meta-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 8px;
        border: 1px solid #94a3b8;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 9pt;
      }

      .pdf-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 8px;
        font-size: 8.5pt;
      }

      .pdf-table th,
      .pdf-table td {
        border: 1px solid #94a3b8;
        padding: 3.5px 6px;
        text-align: left;
      }

      .pdf-table th {
        background: #e2e8f0 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-weight: 800;
      }

      .pdf-table td.center,
      .pdf-table th.center {
        text-align: center;
        width: 54px;
      }

      .pdf-sec-row td {
        background: #f1f5f9 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-weight: 800;
        color: #0f172a;
      }

      .pdf-footer-box {
        border: 1px solid #94a3b8;
        padding: 7px 9px;
        border-radius: 4px;
        font-size: 9pt;
      }

      .pdf-outcome-summary {
        border: 1.5px solid #0f172a;
        background: #f8fafc !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 9pt;
        font-weight: 800;
        margin-bottom: 6px;
      }
    }
  </style>
</head>
<body>
  <!-- =======================================================================
       TOP COMMAND BAR
       ======================================================================= -->
  <header class="command-bar">
    <div class="brand-cluster">
      <span class="brand-tag">Medical Training Console</span>
      <select id="caseSelect" class="case-select" aria-label="Select Assessment Scenario"></select>
    </div>

    <div class="utility-cluster">
      <div class="timer-box">
        <span id="timerDisplay" class="timer-display">00:00</span>
        <button type="button" id="btnTimerToggle" class="btn start">Start</button>
        <button type="button" id="btnTimerReset" class="btn">Reset</button>
      </div>

      <button type="button" id="btnJsonModal" class="btn">Scenario JSON</button>
      <button type="button" id="btnExport" class="btn export">Export PDF</button>
    </div>
  </header>

  <!-- =======================================================================
       TWO-SIDED SPLIT WORKSPACE
       ======================================================================= -->
  <div class="split-workspace">
    <!-- LEFT HAND SIDE: LIVE VITALS + SIMPLIFIED SEQUENTIAL GFS OM165 BUTTONS -->
    <aside class="left-pane" aria-label="Live Vitals and Sequential Assessment Buttons">
      <div class="vitals-dock">
        <div class="vitals-dock-header">
          <span id="physStageBadge" class="stage-label">Initial · Compensated Shock</span>
          <div class="stage-switch-group">
            <button type="button" id="btnStageInitial" class="stage-btn active-init">1. Initial</button>
            <button type="button" id="btnStageDeteriorate" class="stage-btn">2. Deteriorated</button>
          </div>
        </div>

        <div id="vitalsGrid" class="vitals-grid"></div>
        <div id="vitalsGridBottom" class="vitals-grid-bottom"></div>
      </div>

      <div id="leftFlowScroll" class="flow-scroll"></div>
    </aside>

    <!-- RIGHT HAND SIDE: SELECTED ITEM DETAILS -> COMPLETE BUTTON -> END TIME LOG & RUBRIC -->
    <main id="rightPane" class="right-pane" aria-label="Assessment Details, Time Log and Grading Rubric">
      <!-- 1. Selected Item Detailed Information (Extra-Large Bullet Readout First -> Time-Critical Below) -->
      <section id="detailSpotlight" class="detail-spotlight" aria-live="polite"></section>

      <!-- 2. Complete Training Action Bar -->
      <div class="complete-bar">
        <button type="button" id="btnCompleteTraining" class="btn-complete-run">
          ✓ Complete Training
        </button>
      </div>

      <!-- 3. Chronological Time Log (Collapsed Until Training Completed) -->
      <section id="timeLogCard" class="panel-card" style="display: none;" aria-label="Chronological Time Log">
        <div class="panel-head">
          <span class="panel-title">Chronological Time Log (Expected Outcomes, Stay Duration &amp; Interventions)</span>
          <span id="logCountBadge" style="font-size: 12.5px; font-weight: 700; color: var(--text-muted);">0 logged</span>
        </div>

        <div id="outcomesSummaryWrap"></div>
        <div id="timeLogList" class="log-list expanded"></div>
      </section>

      <!-- 4. GFS Form OM165 Grading Rubric — Shown When Training Completed -->
      <section id="rubricSectionWrap" class="rubric-container" style="display: none;" aria-label="GFS Form OM165 Grading Rubric"></section>
    </main>
  </div>

  <!-- =======================================================================
       TWO-PAGE PRINT / PDF CONTAINER (FRONT PAGE: RUBRIC | BACK PAGE: TIME LOG)
       ======================================================================= -->
  <div id="printDocument" class="print-only-doc" aria-hidden="true"></div>

  <!-- =======================================================================
       SCENARIO JSON VIEW / IMPORT MODAL
       ======================================================================= -->
  <div id="jsonModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <span id="jsonModalTitle" style="font-weight: 800; font-size: 15px;">Scenario JSON (View / Upload / Import)</span>
        <button type="button" id="btnCloseJson">Close</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: var(--text-secondary);">
          Upload a <code>.json</code> scenario file from your device or paste scenario JSON below to load it into the console.
        </p>
        <input type="file" id="jsonFileInput" accept=".json,application/json" style="display: none;" />
        <textarea id="jsonTextarea" class="json-editor" spellcheck="false"></textarea>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" id="btnUploadJsonFile" class="btn active-cyan">Upload .json File</button>
          <button type="button" id="btnCopyJson" class="btn">Copy JSON</button>
          <button type="button" id="btnApplyJson" class="btn start">Load JSON Scenario</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /* =========================================================================
       1. SCENARIO 4 – BLUNT TRAUMA (STRICTLY BASED ON GFS FORM OM165)
       ========================================================================= */
    const STORAGE_KEY_CUSTOM_SCENARIOS = "gfs_mtc_custom_scenarios_v1";

    const SCENARIOS = [
      {
        id: "scenario-4-blunt-trauma",
        scenarioNumber: "Scenario 4",
        title: "Scenario 4 – Blunt Trauma (Mountain Bike Trail)",
        expectedOutcomes: [
          {
            id: "eo_scene_ppe",
            category: "Assessment",
            text: "Scene size-up, strict PPE & utilizes 1 bystander",
            requiredItemIds: ["scene_up"]
          },
          {
            id: "eo_shock",
            category: "Assessment",
            text: "Identifies early shock (HR 118, pale/cool/diaphoretic) & internal bleed",
            requiredItemIds: ["c_circ"]
          },
          {
            id: "eo_chest_abd",
            category: "Assessment",
            text: "Identifies L rib crepitus/reduced breath sounds & LUQ/epigastric guarding",
            requiredItemIds: ["e_chest", "e_abdomen"]
          },
          {
            id: "eo_femur",
            category: "Assessment",
            text: "Identifies L femur fracture & recognizes traction splint contraindication",
            requiredItemIds: ["e_extrem"]
          },
          {
            id: "eo_sample",
            category: "Assessment",
            text: "Gathers SAMPLE history from patient & bystander",
            requiredItemIds: ["o_sample"]
          },
          {
            id: "eo_atmist",
            category: "Assessment",
            text: "Reassesses post-intervention vitals & delivers structured ATMIST handover",
            requiredItemIds: ["secondary_atmist"]
          },
          {
            id: "eo_smr",
            category: "Intervention",
            text: "Delegates manual spinal motion restriction (SMR) to bystander",
            requiredItemIds: ["a_airway"],
            requiredIntIds: ["smr_bystander"]
          },
          {
            id: "eo_o2",
            category: "Intervention",
            text: "Administers 15L NRB high-flow oxygen for rapid shallow breathing (SpO2 91%)",
            requiredItemIds: ["b_breathing"],
            requiredIntIds: ["o2_nrb"]
          },
          {
            id: "eo_pelvis",
            category: "Intervention",
            text: "Applies pelvic binder centered at greater trochanters for pelvic instability",
            requiredItemIds: ["e_pelvis"],
            requiredIntIds: ["pelvic_binder"]
          },
          {
            id: "eo_hypothermia",
            category: "Intervention",
            text: "Performs log-roll posterior check, maintains SMR & prevents hypothermia",
            requiredItemIds: ["e_posterior"]
          },
          {
            id: "eo_load_go",
            category: "Intervention",
            text: "Declares Load & Go and notifies Aircraft / Air Command early",
            requiredItemIds: ["o_load_go"],
            requiredIntIds: ["load_go_notify"]
          },
          {
            id: "eo_airway_loc",
            category: "Intervention",
            text: "Suctions gurgling airway & maintains patency on LOC drop (GCS 9)",
            requiredItemIds: ["reassess_airway"],
            requiredIntIds: ["airway_suction"]
          },
          {
            id: "eo_tension",
            category: "Intervention",
            text: "Performs left needle decompression & BVM ventilation for tension pneumothorax",
            requiredItemIds: ["reassess_tension"],
            requiredIntIds: ["needle_decomp"]
          }
        ],
        computeVitals: function (doneInt, deteriorated) {
          const hasO2 = !!doneInt.o2_nrb;
          const hasDecomp = !!doneInt.needle_decomp;
          const hasBinder = !!doneInt.pelvic_binder;

          if (deteriorated) {
            if (hasDecomp) {
              return {
                stageText: "Decompressed · Stabilizing",
                stageClass: "treated",
                bp: hasBinder ? "88/54 mmHg" : "84/56 mmHg",
                bpClass: "c-amber",
                hr: "124/min (weak radial)",
                hrClass: "c-amber",
                rr: "28/min (BVM/NRB)",
                rrClass: "c-amber",
                spo2: "93% (post-decomp)",
                spo2Class: "c-emerald",
                gcs: "GCS 12 [4/3/5] · Improving",
                gcsClass: "c-amber",
                hstix: "4.7 mmol/L",
                hstixClass: "c-emerald",
                skin: "Pale, cool, diaphoretic",
                skinClass: "c-amber",
                extra: "EtCO2 34 mmHg (square)"
              };
            }
            return {
              stageText: "Deteriorated · Evolving Tension Pneumo",
              stageClass: "crit",
              bp: "84/56 mmHg",
              bpClass: "c-red",
              hr: "132/min (weak radial)",
              hrClass: "c-red",
              rr: "32/min (shallow/labored)",
              rrClass: "c-red",
              spo2: "85% (despite O2)",
              spo2Class: "c-red",
              gcs: "GCS 9 [2/2/5] · Pain only",
              gcsClass: "c-red",
              hstix: "4.7 mmol/L",
              hstixClass: "c-emerald",
              skin: "Pale, cool, diaphoretic",
              skinClass: "c-red",
              extra: "Airway gurgling · L breath sounds absent"
            };
          }

          return {
            stageText: "Initial · Compensated Shock",
            stageClass: "",
            bp: hasBinder ? "96/64 mmHg" : "92/60 mmHg",
            bpClass: "c-amber",
            hr: "118/min (weak radial)",
            hrClass: "c-amber",
            rr: "28/min (rapid/shallow)",
            rrClass: "c-amber",
            spo2: hasO2 ? "96% (15L NRB)" : "91% (Room Air)",
            spo2Class: hasO2 ? "c-emerald" : "c-amber",
            gcs: "GCS 15 [4/5/6] · Alert/dizzy",
            gcsClass: "c-emerald",
            hstix: "4.7 mmol/L",
            hstixClass: "c-emerald",
            skin: "Pale, cool, diaphoretic",
            skinClass: "c-amber",
            extra: "EtCO2 34 mmHg (square)"
          };
        },
        sequenceGroups: [
          {
            groupTitle: "X · Catastrophic Hemorrhage",
            items: [
              {
                id: "scene_up",
                btnLabel: "Scene & General",
                phaseLabel: "Scene Size-Up & General Impression",
                title: "Scene Safety, PPE & General Impression",
                bullets: [
                  "Remote mountain bike trail — scene safe, 1 patient",
                  "1 bystander available to assist if directed",
                  "Patient supine, helmet on, left leg flexed",
                  "States: “I feel dizzy… I can’t breathe properly.”"
                ],
                detail: "Standard precautions (gloves/eye protection) required. Over-the-handlebars fall onto tree root 40 minutes ago."
              },
              {
                id: "x_hem",
                btnLabel: "X · External Bleed",
                phaseLabel: "X — Catastrophic Hemorrhage",
                title: "External Hemorrhage Sweep",
                bullets: [
                  "No external wounds, bruising, or blood visible",
                  "Suspect occult internal hemorrhage (chest, abdomen, pelvis, femur)"
                ],
                detail: "Confirm absence of catastrophic external bleeding before moving immediately to Airway & SMR."
              }
            ]
          },
          {
            groupTitle: "A · Airway",
            items: [
              {
                id: "a_airway",
                btnLabel: "A · Airway & SMR",
                phaseLabel: "A — Airway & Manual SMR",
                title: "Airway Patency & Delegate Manual SMR",
                bullets: [
                  "Airway clear and open initially",
                  "Speaks only in short phrases due to breathlessness",
                  "Helmet on (cracked but intact)"
                ],
                detail: "High-force ejection over handlebars indicates spinal motion restriction (SMR). Delegate manual in-line stabilization to the bystander immediately.",
                timeCritical: {
                  intId: "smr_bystander",
                  label: "Manual SMR Delegated to Bystander",
                  actionText: "Delegate manual in-line spinal stabilization to the bystander before moving on.",
                  rubricId: "a_open"
                }
              }
            ]
          },
          {
            groupTitle: "B · Breathing",
            items: [
              {
                id: "b_breathing",
                btnLabel: "B · Breathing & O2",
                phaseLabel: "B — Breathing & Oxygen Therapy",
                title: "Breathing Assessment & High-Flow Oxygen",
                bullets: [
                  "RR ~28/min, rapid and shallow",
                  "SpO2 ~91% on room air",
                  "Reduced left chest rise; left rib tenderness & crepitus",
                  "Breath sounds reduced on left, present on right"
                ],
                detail: "Spontaneous breathing present — BVM not required initially, but keep BVM ready if respiratory effort worsens or LOC drops.",
                timeCritical: {
                  intId: "o2_nrb",
                  label: "15L NRB High-Flow O2 Applied",
                  actionText: "Apply high-concentration supplemental oxygen via non-rebreather mask (15 L/min).",
                  rubricId: "b_o2"
                }
              }
            ]
          },
          {
            groupTitle: "C · Circulation",
            items: [
              {
                id: "c_circ",
                btnLabel: "C · Circulation & Shock",
                phaseLabel: "C — Circulation & Perfusion",
                title: "Pulse, Skin Perfusion & Shock Recognition",
                bullets: [
                  "Radial pulse rapid & weak (~118/min)",
                  "Skin pale, cool, and diaphoretic",
                  "Early compensated hypovolemic/obstructive shock"
                ],
                detail: "No major external bleeding; recognize internal hemorrhage from chest, abdomen, pelvis, and left femur."
              }
            ]
          },
          {
            groupTitle: "D · Disability",
            items: [
              {
                id: "d_neuro",
                btnLabel: "D · Disability & Pupils",
                phaseLabel: "D — Disability & Neurological Status",
                title: "LOC, Pupils, H'stix & Pain",
                bullets: [
                  "Alert initially (GCS 15 [4/5/6]), dizzy & anxious",
                  "Pupils 3 mm, equal and reactive",
                  "Severe pain in left chest, left abdomen & left hip/thigh",
                  "H'stix 4.7 mmol/L (if checked)"
                ],
                detail: "Note: Patient becomes increasingly drowsy and agitated as scenario progresses."
              }
            ]
          },
          {
            groupTitle: "E · Exposure / Environment",
            items: [
              {
                id: "e_head_neck",
                btnLabel: "Head & Neck",
                phaseLabel: "E — Full-Body Survey (Head & Neck)",

    /* =========================================================================
       3. APPLICATION STATE & HELPERS
       ========================================================================= */
    function loadSavedCustomScenarios() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CUSTOM_SCENARIOS);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveCustomScenarios(list) {
      try {
        localStorage.setItem(STORAGE_KEY_CUSTOM_SCENARIOS, JSON.stringify(list));
      } catch (e) {
        /* ignore storage quota errors */
      }
    }

    const state = {
      activeScenarioId: SCENARIOS[0].id,
      customScenarios: loadSavedCustomScenarios(),
      selectedItemId: SCENARIOS[0].sequenceGroups[0].items[0].id,
      currentSessionEntryId: null,
      timerSeconds: 0,
      timerRunning: false,
      timerInterval: null,
      resetPending: false,
      deteriorated: false,
      assessedItems: {},
      doneInterventions: {},
      timeLog: [],
      outcomeOverrides: {},
      trainingCompleted: false,
      candidateName: "",
      evalDate: new Date().toISOString().slice(0, 10),
      rubricGrades: {},
      overallRating: "",
      remarks: ""
    };

    function pad2(n) {
      return String(Math.max(0, Math.floor(n))).padStart(2, "0");
    }

    function fmtTime(sec) {
      return `${pad2(sec / 60)}:${pad2(sec % 60)}`;
    }

    function fmtDuration(sec) {
      const s = Math.max(0, Math.floor(sec));
      if (s < 60) return `${s}s`;
      return `${Math.floor(s / 60)}m ${pad2(s % 60)}s`;
    }

    function getAllScenarios() {
      return [...SCENARIOS, ...state.customScenarios];
    }

    function getActiveScenario() {
      return getAllScenarios().find(s => s.id === state.activeScenarioId) || SCENARIOS[0];
    }

    function resolveScenarioVitals(sc, doneInt, deteriorated) {
      if (typeof sc.computeVitals === "function") {
        return sc.computeVitals(doneInt, deteriorated);
      }

      const fallback = {
        stageText: deteriorated ? "Deteriorated" : "Initial",
        stageClass: deteriorated ? "crit" : "",
        bp: "—",
        bpClass: "",
        hr: "—",
        hrClass: "",
        rr: "—",
        rrClass: "",
        spo2: "—",
        spo2Class: "",
        gcs: "—",
        gcsClass: "",
        hstix: "—",
        hstixClass: "",
        skin: "—",
        skinClass: "",
        extra: ""
      };

      if (!sc.vitals || typeof sc.vitals !== "object") {
        return fallback;
      }

      const base = deteriorated && sc.vitals.deteriorated
        ? { ...fallback, ...sc.vitals.deteriorated }
        : { ...fallback, ...(sc.vitals.initial || {}) };

      if (sc.vitals.afterInterventions && typeof sc.vitals.afterInterventions === "object") {
        Object.keys(sc.vitals.afterInterventions).forEach(intId => {
          if (doneInt[intId] !== undefined) {
            Object.assign(base, sc.vitals.afterInterventions[intId]);
          }
        });
      }

      return base;
    }

    function getFlatItems(sc) {
      const out = [];
      (sc.sequenceGroups || []).forEach(g => {
        (g.items || []).forEach(it => out.push(it));
      });
      return out;
    }

    function findItem(sc, itemId) {
      return getFlatItems(sc).find(it => it.id === itemId) || getFlatItems(sc)[0];
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function copyTextSafe(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
      } catch (e) {
        /* ignore */
      }
      document.body.removeChild(ta);
    }

    /* =========================================================================
       4. TIMER & ITEM STAY-DURATION LOGGING
       ========================================================================= */
    function updateTimerUI() {
      const disp = document.getElementById("timerDisplay");
      const btn = document.getElementById("btnTimerToggle");
      disp.textContent = fmtTime(state.timerSeconds);
      if (state.timerRunning) {
        disp.classList.add("running");
        btn.textContent = "Pause";
        btn.className = "btn pause";
      } else {
        disp.classList.remove("running");
        btn.textContent = state.timerSeconds > 0 ? "Resume" : "Start";
        btn.className = "btn start";
      }
    }

    function startTimer() {
      if (state.timerRunning) return;
      state.timerRunning = true;
      updateTimerUI();
      state.timerInterval = setInterval(() => {
        state.timerSeconds += 1;
        updateTimerUI();
      }, 1000);
    }

    function pauseTimer() {
      state.timerRunning = false;
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      updateTimerUI();
    }

    function finalizeCurrentItemStay() {
      if (!state.currentSessionEntryId) return;
      const entry = state.timeLog.find(e => e.id === state.currentSessionEntryId);
      if (entry) {
        entry.endSec = state.timerSeconds;
        entry.staySec = Math.max(0, entry.endSec - entry.startSec);
        state.assessedItems[entry.itemId] = (state.assessedItems[entry.itemId] || 0) + entry.staySec;
      }
      state.currentSessionEntryId = null;
    }

    function selectItem(itemId) {
      const sc = getActiveScenario();
      const target = findItem(sc, itemId);
      if (!target) return;

      if (!state.timerRunning && !state.trainingCompleted) {
        startTimer();
      }

      if (state.selectedItemId !== target.id || !state.currentSessionEntryId) {
        finalizeCurrentItemStay();
        const entryId = `log_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        state.timeLog.push({
          id: entryId,
          type: "assess",
          itemId: target.id,
          label: target.title,
          startSec: state.timerSeconds,
          endSec: null,
          staySec: 0
        });
        state.currentSessionEntryId = entryId;
        if (state.assessedItems[target.id] === undefined) {
          state.assessedItems[target.id] = 0;
        }
      }

      if (target.id === "reassess_arrest" && !state.deteriorated) {
        state.deteriorated = true;
      }

      state.selectedItemId = target.id;
      renderAll();
    }

    function toggleInterventionDone(intId, label, rubricId) {
      if (!state.timerRunning && !state.trainingCompleted) {
        startTimer();
      }

      if (state.doneInterventions[intId] !== undefined) {
        delete state.doneInterventions[intId];
        state.timeLog = state.timeLog.filter(e => !(e.type === "interv" && e.intId === intId));
        showToast(`Unchecked: ${label}`);
      } else {
        const ts = state.timerSeconds;
        state.doneInterventions[intId] = ts;
        state.timeLog.push({
          id: `int_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          type: "interv",
          intId: intId,
          label: label,
          startSec: ts,
          endSec: ts,
          staySec: 0
        });

        if ((intId === "airway_suction" || intId === "needle_decomp" || intId === "cpr_aed") && !state.deteriorated) {
          state.deteriorated = true;
        }
        showToast(`Done @ ${fmtTime(ts)}: ${label}`);
      }

      renderAll();
    }

    function resetAll() {
      pauseTimer();
      const sc = getActiveScenario();
      const firstItem = getFlatItems(sc)[0];
      state.timerSeconds = 0;
      state.deteriorated = false;
      state.assessedItems = {};
      state.doneInterventions = {};
      state.timeLog = [];
      state.outcomeOverrides = {};
      state.trainingCompleted = false;
      state.rubricGrades = {};
      state.overallRating = "";
      state.remarks = "";
      state.selectedItemId = firstItem ? firstItem.id : null;
      state.currentSessionEntryId = null;

      if (firstItem) {
        const entryId = `log_init_${Date.now()}`;
        state.timeLog.push({
          id: entryId,
          type: "assess",
          itemId: firstItem.id,
          label: firstItem.title,
          startSec: 0,
          endSec: null,
          staySec: 0
        });
        state.currentSessionEntryId = entryId;
        state.assessedItems[firstItem.id] = 0;
      }

      updateTimerUI();
      renderAll();
    }

    /* =========================================================================
       5. EXPECTED OUTCOMES EVALUATION & UI RENDERING
       ========================================================================= */
    function evaluateExpectedOutcomes(sc) {
      const defs = Array.isArray(sc.expectedOutcomes) && sc.expectedOutcomes.length > 0
        ? sc.expectedOutcomes
        : getFlatItems(sc).map(it => ({
            id: `auto_${it.id}`,
            category: it.timeCritical ? "Intervention" : "Assessment",
            text: it.timeCritical ? `${it.btnLabel} (${it.timeCritical.label})` : it.title,
            requiredItemIds: [it.id],
            requiredIntIds: it.timeCritical ? [it.timeCritical.intId] : []
          }));

      const list = defs.map(def => {
        const reqItems = def.requiredItemIds || [];
        const reqInts = def.requiredIntIds || [];
        const itemsDone = reqItems.every(id => state.assessedItems[id] !== undefined);
        const intsDone = reqInts.every(id => !!state.doneInterventions[id]);
        const autoAchieved = (reqItems.length > 0 || reqInts.length > 0) && itemsDone && intsDone;
        const achieved = state.outcomeOverrides[def.id] !== undefined
          ? state.outcomeOverrides[def.id]
          : autoAchieved;
        const category = def.category || (reqInts.length > 0 ? "Intervention" : "Assessment");

        return {
          ...def,
          category,
          achieved
        };
      });

      const assessmentList = list.filter(o => o.category === "Assessment");
      const interventionList = list.filter(o => o.category === "Intervention");
      const achievedCount = list.filter(o => o.achieved).length;
      const totalCount = list.length;

      return {
        list,
        assessmentList,
        assessmentAchieved: assessmentList.filter(o => o.achieved).length,
        interventionList,
        interventionAchieved: interventionList.filter(o => o.achieved).length,
        achievedCount,
        totalCount,
        allAchieved: totalCount > 0 && achievedCount === totalCount
      };
    }

              const isSelected = it.id === state.selectedItemId;

              if (tc) {
                btnCls += tcDone ? " tc-done" : " time-critical";
