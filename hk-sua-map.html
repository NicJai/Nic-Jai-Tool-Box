        </button>
      </div>

        <textarea

      const e2 = 2 * f - f * f, ep2 = e2 / (1 - e2), k0 = 0.9996;
      const zone = Math.floor((lng + 180) / 6) + 1;
      const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
      const phi = lat * Math.PI / 180, lam = lng * Math.PI / 180;
      const s = Math.sin(phi), c = Math.cos(phi), t = Math.tan(phi);
      const N = a / Math.sqrt(1 - e2 * s * s);
      const T = t * t, C = ep2 * c * c, A = c * (lam - lon0);
      const M = a * (
        (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256) * phi
        - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * phi)
        + (15 * e2 * e2 / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * phi)
        - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * phi)
      );
      const easting = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
      let northing = k0 * (M + N * t * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
      if (lat < 0) northing += 10000000;
      const band = MGRS_BANDS[Math.min(19, Math.max(0, Math.floor((lat + 80) / 8)))];
      return { zone, band, easting, northing };
    }

    function latLngToMgrs(lat, lng, precision = 4) {
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -80 || lat > 84) return '';
      const { zone, band, easting, northing } = latLngToUtm(lat, lng);
      const colSet = MGRS_COLS[(zone - 1) % 3];
      const colIdx = Math.floor(easting / 100000) - 1;
      if (colIdx < 0 || colIdx >= colSet.length) return '';
      const rowOrigin = zone % 2 === 0 ? 5 : 0;
      const rowIdx = (Math.floor(northing / 100000) + rowOrigin) % 20;
      const div = Math.pow(10, 5 - precision);
      const eStr = String(Math.floor((easting % 100000) / div)).padStart(precision, '0');
      const nStr = String(Math.floor((northing % 100000) / div)).padStart(precision, '0');
      return `${zone}${band} ${colSet[colIdx]}${MGRS_ROWS[rowIdx]} ${eStr} ${nStr}`;
    }

    function utmToLatLng(zone, easting, northing) {
      const a = 6378137.0, f = 1 / 298.257223563;
      const e2 = 2 * f - f * f, ep2 = e2 / (1 - e2), k0 = 0.9996;
      const x = easting - 500000.0;
      const y = northing;
      const m = y / k0;
      const mu = m / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256));
      const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
      const j1 = 3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32;
      const j2 = 21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32;
      const j3 = 151 * Math.pow(e1, 3) / 96;
      const j4 = 1097 * Math.pow(e1, 4) / 512;
      const fp = mu + j1 * Math.sin(2 * mu) + j2 * Math.sin(4 * mu) + j3 * Math.sin(6 * mu) + j4 * Math.sin(8 * mu);
      const s = Math.sin(fp), c = Math.cos(fp), t = Math.tan(fp);
      const C1 = ep2 * c * c, T1 = t * t;
      const N1 = a / Math.sqrt(1 - e2 * s * s);
      const R1 = a * (1 - e2) / Math.pow(1 - e2 * s * s, 1.5);
      const D = x / (N1 * k0);
      const latRad = fp - (N1 * t / R1) * (
        D * D / 2
        - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24
        + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720
      );
      const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
      const lngRad = lon0 + (
        D
        - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
        + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120
      ) / c;
      return [Number((latRad * 180 / Math.PI).toFixed(5)), Number((lngRad * 180 / Math.PI).toFixed(5))];
    }

    function mgrsToLatLng(refStr) {
      if (!refStr) return null;
      const cleaned = refStr.toUpperCase().replace(/[^A-Z0-9]/g, '');
      const m = cleaned.match(/^(?:(\d{1,2})([C-X]))?([A-Z]{2})(\d{4,10})$/);
      if (!m || m[4].length % 2 !== 0) return null;

      const sq = m[3];
      const digits = m[4];
      // Default to Hong Kong UTM zone (49Q for GE/HE, 50Q for JK/JL/KK/KL)
      const zone = m[1] ? parseInt(m[1], 10) : (['GE', 'HE'].includes(sq) ? 49 : 50);
      const colSet = MGRS_COLS[(zone - 1) % 3];
      const colIdx = colSet.indexOf(sq[0]);
      const rowIdx = MGRS_ROWS.indexOf(sq[1]);
      if (colIdx < 0 || rowIdx < 0) return null;

      const half = digits.length / 2;
      const scale = Math.pow(10, 5 - half);
      const easting = (colIdx + 1) * 100000 + parseInt(digits.slice(0, half), 10) * scale + scale / 2;
      const rowOrigin = zone % 2 === 0 ? 5 : 0;
      const rowOffset = ((rowIdx - rowOrigin + 20) % 20) * 100000;
      // Band Q (Hong Kong, ~22°N) lies in the 2,000,000m northing cycle
      const northing = 2000000 + rowOffset + parseInt(digits.slice(half), 10) * scale + scale / 2;
      const ll = utmToLatLng(zone, easting, northing);
      if (ll[0] >= 21.5 && ll[0] <= 23.2 && ll[1] >= 113.2 && ll[1] <= 115.2) return ll;
      return null;
    }

    function geocodeHK(text) {
      if (!text) return null;
      const norm = text.toLowerCase().replace(/['’]/g, ' ');
      let best = null, score = 0;
      for (const item of HK_LANDMARKS) {
        for (const name of item.names) {
          if (norm.includes(name) && name.length > score) {
            score = name.length;
            best = item;
          }
        }
      }
      return best;
    }

    /**
     * ============================================================================
     * 4. TIME & ACTIVE-TODAY EVALUATION (HKT = UTC+8)
     * ============================================================================
     */
    const MONTHS = {
      JAN: 0, JANUARY: 0,
      FEB: 1, FEBRUARY: 1,
      MAR: 2, MARCH: 2,
      APR: 3, APRIL: 3,
      MAY: 4,
      JUN: 5, JUNE: 5,
      JUL: 6, JULY: 6,
      AUG: 7, AUGUST: 7,
      SEP: 8, SEPT: 8, SEPTEMBER: 8,
      OCT: 9, OCTOBER: 9,
      NOV: 10, NOVEMBER: 10,
      DEC: 11, DECEMBER: 11
    };
    const WEEKDAYS = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
    const MONTH_REGEX_SRC = 'JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|SEPT|OCTOBER|NOVEMBER|DECEMBER|JAN|FEB|MAR|APR|JUN|JUL|AUG|SEP|OCT|NOV|DEC';

    function getNowHKT() {
      const now = new Date();
      const hkt = new Date(now.getTime() + 8 * 3600000);
      const y = hkt.getUTCFullYear();
      const m = hkt.getUTCMonth();
      const d = hkt.getUTCDate();
      const hh = String(hkt.getUTCHours()).padStart(2, '0');
      const mm = String(hkt.getUTCMinutes()).padStart(2, '0');
      const startUtc = new Date(Date.UTC(y, m, d, 0, 0, 0) - 8 * 3600000);
      const endUtc = new Date(Date.UTC(y, m, d, 23, 59, 59, 999) - 8 * 3600000);
      const dateStr = `${String(d).padStart(2, '0')}/${String(m + 1).padStart(2, '0')}/${y}`;
      return { y, m, d, hhmm: `${hh}:${mm}`, dateStr, startUtc, endUtc };
    }

    function toMinutes(t) {
      const clean = (t || '').replace(/[^0-9:]/g, '');
      if (clean.includes(':')) {
        const [h, m] = clean.split(':').map(Number);
        return (!isNaN(h) && !isNaN(m)) ? h * 60 + m : null;
      }
      if (clean.length === 4) return parseInt(clean.slice(0, 2), 10) * 60 + parseInt(clean.slice(2), 10);
      return null;
    }

    function expandDayTokens(str) {
      const days = new Set();
      // Remove HHMM-HHMM time ranges before reading day numbers/ranges
      const cleaned = str.replace(/\b\d{4}\s*-\s*\d{4}\b/g, ' ');
      for (const rm of cleaned.matchAll(/\b(\d{1,2})\s*-\s*(\d{1,2})\b/g)) {
        const s = parseInt(rm[1], 10), e = parseInt(rm[2], 10);
        if (s >= 1 && e <= 31 && s <= e) {
          for (let d = s; d <= e; d++) days.add(d);
        }
      }
      const noRanges = cleaned.replace(/\b\d{1,2}\s*-\s*\d{1,2}\b/g, ' ');
      for (const dm of noRanges.matchAll(/\b(\d{1,2})\b/g)) {
        const d = parseInt(dm[1], 10);
        if (d >= 1 && d <= 31) days.add(d);
      }
      return days;
    }

    function extractUtcTimeWindows(str) {
      const wins = [];
      for (const m of (str || '').matchAll(/\b(\d{2})(\d{2})\s*-\s*(\d{2})(\d{2})\b/g)) {
        wins.push({ sH: parseInt(m[1], 10), sM: parseInt(m[2], 10), eH: parseInt(m[3], 10), eM: parseInt(m[4], 10) });
      }
      return wins;
    }

    function utcDayWindowsOverlapRange(year, month, day, windows, rangeStart, rangeEnd) {
      const list = windows.length ? windows : [{ sH: 0, sM: 0, eH: 23, eM: 59 }];
      for (const w of list) {
        const wStart = new Date(Date.UTC(year, month, day, w.sH, w.sM, 0));
        let wEnd = new Date(Date.UTC(year, month, day, w.eH, w.eM, 59, 999));
        if (wEnd < wStart) wEnd = new Date(wEnd.getTime() + 86400000);
        if (wStart <= rangeEnd && wEnd >= rangeStart) return true;
      }
      return false;
    }

    function matchesExplicitScheduleDay(notam, hkt) {
      const rawD = (notam.dField || notam.schedule || '').toUpperCase().replace(/\bUTC\b/g, '').trim();
      if (!rawD || /\bDLY\b|\bDAILY\b|\bH24\b/i.test(rawD)) return true;

      // Normalize "25 NOV" or "24-26 NOV" to "NOV 25" / "NOV 24-26"
      const normalized = rawD.replace(
        new RegExp(`\\b(\\d{1,2}(?:\\s*-\\s*\\d{1,2})?)\\s+(${MONTH_REGEX_SRC})\\b`, 'g'),
        '$2 $1'
      );

      // Candidate UTC calendar dates that intersect today HKT (prev UTC day 16:00-23:59 + curr UTC day 00:00-15:59)
      const prevUtc = new Date(Date.UTC(hkt.y, hkt.m, hkt.d - 1));
      const currUtc = new Date(Date.UTC(hkt.y, hkt.m, hkt.d));
      const candidates = [
        { y: prevUtc.getUTCFullYear(), m: prevUtc.getUTCMonth(), d: prevUtc.getUTCDate(), dow: prevUtc.getUTCDay() },
        { y: currUtc.getUTCFullYear(), m: currUtc.getUTCMonth(), d: currUtc.getUTCDate(), dow: currUtc.getUTCDay() }
      ];

      // 1) Explicit month + day/range schedule (e.g. "NOVEMBER 02-03 05-10 ... 0000-1300")
      const monthRegex = new RegExp(`\\b(${MONTH_REGEX_SRC})\\b([\\s\\S]*?)(?=\\b(?:${MONTH_REGEX_SRC})\\b|$)`, 'g');
      const monthChunks = [...normalized.matchAll(monthRegex)];
      if (monthChunks.length > 0) {
        const globalWins = extractUtcTimeWindows(normalized);
        for (const chunk of monthChunks) {
          const monIdx = MONTHS[chunk[1]];
          const body = chunk[2];
          const days = expandDayTokens(body);
          const wins = extractUtcTimeWindows(body);
          const effectiveWins = wins.length ? wins : globalWins;

          for (const c of candidates) {
            if (c.m !== monIdx) continue;
            if (days.size === 0 || days.has(c.d)) {
              if (utcDayWindowsOverlapRange(c.y, c.m, c.d, effectiveWins, hkt.startUtc, hkt.endUtc)) return true;
            }
          }
        }
        return false;
      }

      // 2) Weekday schedule (e.g. "MON-FRI 0100-0900", "MON WED FRI 0200-0800")
      if (/\b(MON|TUE|WED|THU|FRI|SAT|SUN)\b/.test(normalized)) {
        const allowedDows = new Set();
        for (const rm of normalized.matchAll(/\b(MON|TUE|WED|THU|FRI|SAT|SUN)\s*-\s*(MON|TUE|WED|THU|FRI|SAT|SUN)\b/g)) {
          let cur = WEEKDAYS[rm[1]], end = WEEKDAYS[rm[2]];
          for (let i = 0; i < 7; i++) {
            allowedDows.add(cur);
            if (cur === end) break;
            cur = (cur + 1) % 7;
          }
        }
        for (const dm of normalized.matchAll(/\b(MON|TUE|WED|THU|FRI|SAT|SUN)\b/g)) {
          allowedDows.add(WEEKDAYS[dm[1]]);
        }
        const wins = extractUtcTimeWindows(normalized);
        for (const c of candidates) {
          if (allowedDows.has(c.dow) && utcDayWindowsOverlapRange(c.y, c.m, c.d, wins, hkt.startUtc, hkt.endUtc)) return true;
        }
        return false;
      }

      // 3) Day numbers without month names (e.g. "04 05 24 25 2315-0600" or "24-28 0100-0900")
      const bareDays = expandDayTokens(normalized);
      if (bareDays.size > 0) {
        const wins = extractUtcTimeWindows(normalized);
        for (const c of candidates) {
          if (bareDays.has(c.d) && utcDayWindowsOverlapRange(c.y, c.m, c.d, wins, hkt.startUtc, hkt.endUtc)) return true;
        }
        return false;
      }

      return true;
    }

    function isNotamActiveToday(notam) {
      const hkt = getNowHKT();
      const fromD = notam.validFromUtc ? new Date(notam.validFromUtc) : null;
      const toD = notam.validToUtc ? new Date(notam.validToUtc) : null;
      if (fromD && !isNaN(fromD.getTime()) && fromD > hkt.endUtc) return false;
      if (toD && !isNaN(toD.getTime()) && toD < hkt.startUtc) return false;
      return matchesExplicitScheduleDay(notam, hkt);
    }

    function getNotamStatus(notam) {
      const now = new Date();
      const fromD = notam.validFromUtc ? new Date(notam.validFromUtc) : null;
      const toD = notam.validToUtc ? new Date(notam.validToUtc) : null;
      if (toD && !isNaN(toD.getTime()) && now > toD) {
        return { code: 'expired', activeToday: false, color: '#64748b', dot: 'bg-slate-500' };
      }

      const activeToday = isNotamActiveToday(notam);
      if (!activeToday) {
        return { code: 'upcoming', activeToday: false, color: '#60a5fa', dot: 'bg-blue-300' };
      }

      const inOverallRange = (!fromD || now >= fromD) && (!toD || now <= toD);
      let inWindow = true;
      if (Array.isArray(notam.dailyWindowsUtc) && notam.dailyWindowsUtc.length) {
        const cur = now.getUTCHours() * 60 + now.getUTCMinutes();
        inWindow = notam.dailyWindowsUtc.some(w => {
          const s = toMinutes(w.start), e = toMinutes(w.end);
          return s !== null && e !== null && (e >= s ? (cur >= s && cur <= e) : (cur >= s || cur <= e));
        });
      }

      if (inOverallRange && inWindow) {
        return { code: 'live', activeToday: true, color: '#0ea5e9', dot: 'bg-sky-400' };
      }
      return { code: 'today', activeToday: true, color: '#3b82f6', dot: 'bg-blue-500' };
    }

    /**
     * ============================================================================
     * 5. LIVE HK AIS SERIES-C NOTAM FETCHER & ICAO PARSER
     * ============================================================================
     */
    function parseIcaoCoord(tok) {
      // 6-digit lat + 7-digit lng (e.g. 222612N1141629E or N222612E1141629)
      let m = tok.match(/^([NS])?(\d{2})(\d{2})(\d{2})([NS])?([EW])?(\d{3})(\d{2})(\d{2})([EW])?$/i);
      if (m) {
        let lat = parseInt(m[2], 10) + parseInt(m[3], 10) / 60 + parseInt(m[4], 10) / 3600;
        let lng = parseInt(m[7], 10) + parseInt(m[8], 10) / 60 + parseInt(m[9], 10) / 3600;
        if ((m[1] || m[5] || 'N').toUpperCase() === 'S') lat = -lat;
        if ((m[6] || m[10] || 'E').toUpperCase() === 'W') lng = -lng;
        if (lat >= 21.5 && lat <= 23.2 && lng >= 113.2 && lng <= 115.2) return [Number(lat.toFixed(5)), Number(lng.toFixed(5))];
      }
      // 4-digit lat + 5-digit lng (e.g. 2217N11410E)
      m = tok.match(/^([NS])?(\d{2})(\d{2})([NS])?([EW])?(\d{3})(\d{2})([EW])?$/i);
      if (m) {
        let lat = parseInt(m[2], 10) + parseInt(m[3], 10) / 60;
        let lng = parseInt(m[6], 10) + parseInt(m[7], 10) / 60;
        if ((m[1] || m[4] || 'N').toUpperCase() === 'S') lat = -lat;
        if ((m[5] || m[8] || 'E').toUpperCase() === 'W') lng = -lng;
        if (lat >= 21.5 && lat <= 23.2 && lng >= 113.2 && lng <= 115.2) return [Number(lat.toFixed(5)), Number(lng.toFixed(5))];
      }
      return null;
    }

    function parseIcaoStamp(s) {
      if (!s || s.length < 10) return null;
      return `20${s.slice(0, 2)}-${s.slice(2, 4)}-${s.slice(4, 6)}T${s.slice(6, 8)}:${s.slice(8, 10)}:00Z`;
    }

    function parseSeriesCBlock(raw) {
      const text = raw.replace(/\r?\n/g, ' ').replace(/\s+/g, ' ').trim();
      const idM = text.match(/\b(C\d{4}\/\d{2})\b/i);
      if (!idM) return null;
      const notamNo = idM[1].toUpperCase();

      // Match Q-line allowing internal spaces (e.g. "Q) VHHK/QWULW/IV/BO /W /000/006/2226N11416E002")
      const qM = text.match(/\bQ\)\s*([A-Z]{4})\/([A-Z]{5})\/[^\/]*\/[^\/]*\/[^\/]*\/\d{3}\/\d{3}\/(\d{4}[NS]\d{5}[EW]\d{3})/);
      const bM = text.match(/\bB\)\s*(\d{10})\b/);
      const cM = text.match(/\bC\)\s*(\d{10}(?:EST)?|PERM)\b/i);
      const dM = text.match(/\bD\)\s*(.+?)(?=\s+E\))/);
      const eM = text.match(/\bE\)\s*(.+?)(?=\s+[FG]\)|$)/);
      const gM = text.match(/\bG\)\s*([A-Z0-9]+(?:\s*(?:FT|M)\s*(?:AGL|AMSL)?)?)/i);

      const eText = (eM ? eM[1] : text).replace(/\)\s*$/, '').trim();

      // Extract coordinate tokens from E)
      const tokens = eText.match(/\b(?:[NS]\d{4,6}[EW]\d{5,7}|\d{4,6}[NS]\d{5,7}[EW])\b/gi) || [];
      const coords = tokens.map(parseIcaoCoord).filter(Boolean);

      const radM = eText.match(/\b(\d+(?:\.\d+)?)\s*(KM|M|NM)\s*RADIUS\b/i)
        || eText.match(/\bRADIUS\s*(?:OF\s*)?(\d+(?:\.\d+)?)\s*(KM|M|NM)\b/i);
      let radius = null;
      if (radM) {
        const val = parseFloat(radM[1]);
        const unit = radM[2].toUpperCase();
        radius = unit === 'KM' ? Math.round(val * 1000) : (unit === 'NM' ? Math.round(val * 1852) : Math.round(val));
      }

      let geometryType = 'circle', coordinates = null, lat = null, lng = null;
      if (coords.length >= 3 && !/\bRTE\b|\bROUTE\b/i.test(eText)) {
        geometryType = 'polygon';
        coordinates = coords;
        lat = Number((coords.reduce((s, c) => s + c[0], 0) / coords.length).toFixed(5));
        lng = Number((coords.reduce((s, c) => s + c[1], 0) / coords.length).toFixed(5));
      } else if (coords.length >= 2) {
        geometryType = 'polyline';
        coordinates = coords;
        lat = coords[0][0];
        lng = coords[0][1];
      } else if (coords.length === 1) {
        geometryType = 'circle';
        lat = coords[0][0];
        lng = coords[0][1];
      }

      // Check for Hong Kong UTM GRID / MGRS reference in E) (e.g. "UTM GRID KK060925")
      if (lat === null) {
        const utmM = eText.match(/\b(?:UTM\s*(?:GRID|REF)?\s*)?((?:49|50)[Q]\s*)?([GJHK][EFKL]\s*\d{4,10})\b/i);
        if (utmM) {
          const ll = mgrsToLatLng(`${utmM[1] || ''}${utmM[2]}`);
          if (ll) {
            lat = ll[0];
            lng = ll[1];
          }
        }
      }

      // Fallback to Q-line center & NM radius when E) has no explicit coordinates
      if (qM) {
        const qCenter = parseIcaoCoord(qM[3].slice(0, 11));
        const qNm = parseInt(qM[3].slice(11, 14), 10);
        if (lat === null && qCenter) {
          lat = qCenter[0];
          lng = qCenter[1];
        }
        if (radius === null && Number.isFinite(qNm) && qNm > 0 && qNm <= 25) {
          radius = Math.round(qNm * 1852);
        }
      }

      // Last-resort HK landmark geocode
      if (lat === null) {
        const lm = geocodeHK(eText);
        lat = lm ? lm.lat : 22.3193;
        lng = lm ? lm.lng : 114.1694;
      }
      if (radius === null) radius = 500;

      const dailyWindowsUtc = [];
      if (dM) {
        for (const wm of dM[1].matchAll(/\b(\d{2})(\d{2})-(\d{2})(\d{2})\b/g)) {
          dailyWindowsUtc.push({ start: `${wm[1]}:${wm[2]}`, end: `${wm[3]}:${wm[4]}` });
        }
      }

      // Clean concise title
      const shortTitle = eText
        .replace(/ALL ACFT SHOULD EXER CTN.*$/i, '')
        .replace(/ALL ACFT MUST REMAIN CLEAR.*$/i, '')
        .replace(/BOUNDED BY.*$/i, '')
        .replace(/WI\s+\d+(?:\.\d+)?\s*(?:M|KM)\s*RADIUS.*$/i, '')
        .trim();

      const cStamp = cM ? cM[1].toUpperCase().replace(/EST$/, '') : null;

      return {
        id: `notam-${notamNo.replace('/', '-')}`,
        notamNo,
        title: (shortTitle.length > 62 ? shortTitle.slice(0, 62) + '…' : shortTitle) || `Series-C ${notamNo}`,
        geometryType,
        lat,
        lng,
        radius,
        coordinates,
        upperLimit: gM ? gM[1].toUpperCase() : 'UNL',
        validFromUtc: bM ? parseIcaoStamp(bM[1]) : new Date().toISOString(),
        validToUtc: (cStamp && cStamp !== 'PERM') ? parseIcaoStamp(cStamp) : '2099-12-31T23:59:00Z',
        dailyWindowsUtc,
        dField: dM ? dM[1].trim() : '',
        schedule: dM ? `${dM[1].trim()} UTC` : (bM && cStamp ? `${bM[1].slice(2, 6)} ${bM[1].slice(6)}–${cStamp === 'PERM' ? 'PERM' : cStamp.slice(6)} UTC` : 'Active'),
        rawText: text
      };
    }

    function extractSeriesCFromPayload(payload) {
      if (!payload) return [];
      const plain = String(payload)
        .replace(/<script[\s\S]*?<\/script>/gi, ' ')
        .replace(/<style[\s\S]*?<\/style>/gi, ' ')
        .replace(/<[^>]+>/g, '\n')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&');

      // Split strictly on ICAO NOTAM start headers so parenthetical remarks inside E) are never truncated
      const blocks = plain.split(/(?=(?:\(\s*|^|\n)\s*[AC]\d{4}\/\d{2}\s+NOTAM[NRC]\b)/i);
      const parsedMap = new Map();

      for (const blk of blocks) {
        const trimmed = blk.trim();
        if (!/^\(?\s*C\d{4}\/\d{2}\s+NOTAM[NRC]\b/i.test(trimmed)) continue;
        // Trim any trailing header belonging to the next NOTAM (e.g. "C0494/26 200122 VHHHYNYX")
        const cleanBlk = trimmed.replace(/\s+[AC]\d{4}\/\d{2}\s+\d{6}\s+[A-Z]{8}[\s\S]*$/i, '').trim();
        const parsed = parseSeriesCBlock(cleanBlk);
        if (parsed) parsedMap.set(parsed.notamNo, parsed);
      }

      return Array.from(parsedMap.values());
    }

    async function fetchSeriesCNotams() {
      if (isFetching) return;
      isFetching = true;

      const icon = document.getElementById('syncIcon');
      const label = document.getElementById('syncLabel');
      icon.classList.add('animate-spin');
      label.textContent = 'Syncing…';

      const targetPortal = 'https://www.notam.ais.gov.hk/';
      const endpoints = [
        targetPortal,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetPortal)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(targetPortal)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetPortal)}`,
        `https://r.jina.ai/${targetPortal}`
      ];

      let bestList = [];
      for (const url of endpoints) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 7000);
          const resp = await fetch(url, { signal: ctrl.signal });
          clearTimeout(timer);
          if (!resp.ok) continue;
          const text = await resp.text();
          const found = extractSeriesCFromPayload(text);
          if (found.length > bestList.length) {
            bestList = found;
          }
          // Stop early once we have a full Series-C feed
          if (bestList.length >= 15) break;
        } catch {
          // Try next endpoint
        }
      }

      const hkt = getNowHKT();
      if (bestList.length > 0) {
        seriesCNotams = bestList.sort((a, b) => b.notamNo.localeCompare(a.notamNo));
        saveNotams();
        const activeCount = seriesCNotams.filter(isNotamActiveToday).length;
        document.getElementById('notamSyncStatus').textContent = `Synced ${hkt.hhmm} (${activeCount}/${seriesCNotams.length})`;
        showToast(`Fetched ${seriesCNotams.length} Series-C (${activeCount} active today)`, 'emerald');
      } else {
        document.getElementById('notamSyncStatus').textContent = `Cached (${hkt.hhmm})`;
        showToast('Live fetch blocked by CORS — use + Paste to import', 'amber');
      }

      refreshAll();
      isFetching = false;
      icon.classList.remove('animate-spin');
      label.textContent = 'Fetch NOTAM-C';
    }

    function toggleManualNotamPaste(force) {
      const box = document.getElementById('manualNotamBox');
      box.classList.toggle('hidden', typeof force === 'boolean' ? !force : undefined);
    }

    function handleManualNotamImport() {
      const raw = document.getElementById('manualNotamInput').value.trim();
      if (!raw) return showToast('Paste Series-C NOTAM text first.', 'amber');
      const found = extractSeriesCFromPayload(raw);
      if (!found.length) return showToast('No Series-C NOTAMs (C####/##) detected.', 'red');

      const byNo = new Map(seriesCNotams.map(n => [n.notamNo, n]));
      found.forEach(n => byNo.set(n.notamNo, n));
      seriesCNotams = Array.from(byNo.values()).sort((a, b) => b.notamNo.localeCompare(a.notamNo));
      saveNotams();
      document.getElementById('manualNotamInput').value = '';
      toggleManualNotamPaste(false);
      refreshAll();
      showToast(`Imported ${found.length} Series-C NOTAM(s)`, 'emerald');
    }

    /**
     * ============================================================================
     * 6. LEAFLET MAP & NOTAM RENDERER
     * ============================================================================
     */
    function safeMove(lat, lng, zoom, fly = true) {
      if (!map || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
      const sz = map.getSize();
      if (!sz || sz.x <= 0 || sz.y <= 0) {
        map.invalidateSize({ animate: false });
        map.setView([lat, lng], zoom, { animate: false });
        return;
      }
      if (fly) map.flyTo([lat, lng], zoom, { duration: 0.8 });
      else map.setView([lat, lng], zoom, { animate: false });
    }

    function initMap() {
      const hkGeo = L.layerGroup([
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'Lands Dept HKSAR' }),
        L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/en/wgs84/{z}/{x}/{y}.png', { maxZoom: 19 })
      ]);
      const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 20, attribution: 'CARTO' });
      const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });

      map = L.map('hkMap', {
        center: [22.335, 114.14],
        zoom: 11,
        layers: [hkGeo],
        zoomControl: false
      });

      L.control.zoom({ position: 'topright' }).addTo(map);
      L.control.layers({ 'HK GeoInfo': hkGeo, 'Dark': dark, 'Satellite': sat }, null, { position: 'topright' }).addTo(map);

      notamLayer = L.layerGroup().addTo(map);

      map.on('mousemove', (e) => {
        const { lat, lng } = e.latlng;
        document.getElementById('cursorDD').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        document.getElementById('cursorUTM').textContent = latLngToMgrs(lat, lng, 4) || '—';
      });

      const el = document.getElementById('hkMap');
      if (typeof ResizeObserver !== 'undefined' && el) {
        new ResizeObserver(() => map && map.invalidateSize({ animate: false })).observe(el);
      }
      setTimeout(() => map && map.invalidateSize({ animate: false }), 150);
    }

    function resetMapView() {
      safeMove(22.335, 114.14, 11, true);
    }

    function getVisibleNotams() {
      return scopeFilter === 'today'
        ? seriesCNotams.filter(isNotamActiveToday)
        : seriesCNotams.filter(n => getNotamStatus(n).code !== 'expired');
    }

    function renderNotamsOnMap() {
      notamLayer.clearLayers();
      Object.keys(notamLayersById).forEach(k => delete notamLayersById[k]);

      for (const n of getVisibleNotams()) {
        if (!Number.isFinite(n.lat) || !Number.isFinite(n.lng)) continue;
        const st = getNotamStatus(n);

        let shape = null;
        if (n.geometryType === 'polygon' && Array.isArray(n.coordinates) && n.coordinates.length >= 3) {
          shape = L.polygon(n.coordinates, { color: st.color, weight: 1.75, fillColor: st.color, fillOpacity: 0.16 }).addTo(notamLayer);
        } else if (n.geometryType === 'polyline' && Array.isArray(n.coordinates) && n.coordinates.length >= 2) {
          shape = L.polyline(n.coordinates, { color: st.color, weight: 3, dashArray: '6, 5' }).addTo(notamLayer);
        } else {
          shape = L.circle([n.lat, n.lng], { radius: n.radius || 400, color: st.color, weight: 1.5, fillColor: st.color, fillOpacity: 0.14, dashArray: '4, 4' }).addTo(notamLayer);
        }

        const pin = L.marker([n.lat, n.lng], {
          icon: L.divIcon({
            html: `<span class="px-1.5 py-0.5 rounded bg-slate-950/90 border border-blue-400/70 text-[9.5px] font-mono text-blue-200 shadow whitespace-nowrap">${esc(n.notamNo)}</span>`,
            className: '',
            iconSize: [56, 16],
            iconAnchor: [28, 8]
          })
        }).addTo(notamLayer);

        const utm = latLngToMgrs(n.lat, n.lng, 4);
        const popup = `
          <div class="space-y-1.5 text-xs max-w-[260px]">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono font-semibold text-blue-300">${esc(n.notamNo)}</span>
              <span class="font-mono text-[10px] text-sky-300">${esc(n.upperLimit)}</span>
            </div>
            <div class="text-slate-100 leading-snug">${esc(n.title)}</div>
            <div class="font-mono text-[10px] text-slate-400">${esc(n.schedule)}</div>
            <div class="font-mono text-[10px] text-slate-400">${n.lat.toFixed(5)}, ${n.lng.toFixed(5)} · ${esc(utm)}</div>
            <details class="pt-1 border-t border-slate-800">
              <summary class="text-[10px] text-blue-400 cursor-pointer select-none">Raw NOTAM</summary>
              <div class="mt-1 font-mono text-[9.5px] text-slate-300 max-h-24 overflow-y-auto thin-scroll select-text">${esc(n.rawText)}</div>
            </details>
          </div>
        `;

        const tip = `${n.notamNo} · ${n.upperLimit}`;
        if (shape) shape.bindTooltip(tip, { sticky: true, className: 'notam-tip' }).bindPopup(popup);
        pin.bindTooltip(tip, { direction: 'top', offset: [0, -8], className: 'notam-tip' }).bindPopup(popup);
        notamLayersById[n.id] = pin;
      }
    }

    function focusNotam(id) {
      const n = seriesCNotams.find(x => x.id === id);
      if (!n) return;
      safeMove(n.lat, n.lng, (n.radius && n.radius <= 300) ? 16 : 13, true);
      if (notamLayersById[id]) setTimeout(() => notamLayersById[id].openPopup(), 350);
      if (window.innerWidth < 768) toggleMobileSidebar(false);
    }

    /**
     * ============================================================================
     * 7. MINIMALIST SIDEBAR LIST & UTILITIES
     * ============================================================================
     */
    function setScopeFilter(scope) {
      scopeFilter = scope;
      const isToday = scope === 'today';
      document.getElementById('filterTodayBtn').className = isToday
        ? 'py-1 rounded-md font-medium bg-slate-800 text-white transition-colors'
        : 'py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition-colors';
      document.getElementById('filterAllBtn').className = !isToday
        ? 'py-1 rounded-md font-medium bg-slate-800 text-white transition-colors'
        : 'py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition-colors';
      refreshAll();
    }

    function renderSidebarList() {
      const box = document.getElementById('listContainer');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      const allNonExpired = seriesCNotams.filter(n => getNotamStatus(n).code !== 'expired');
      const activeTodayCount = allNonExpired.filter(isNotamActiveToday).length;
      const ratioText = `(${activeTodayCount} / ${allNonExpired.length})`;

      document.getElementById('notamRatio').textContent = ratioText;
      document.getElementById('mobileBadgeCount').textContent = ratioText;

      const items = getVisibleNotams().filter(n => !q || `${n.notamNo} ${n.title} ${n.rawText}`.toLowerCase().includes(q));
      if (!items.length) {
        box.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">${scopeFilter === 'today' ? 'No Series-C NOTAMs active today' : 'No Series-C NOTAMs'}</div>`;
        return;
      }

      box.innerHTML = items.map(n => {
        const st = getNotamStatus(n);
        return `
          <div onclick="focusNotam('${n.id}')" class="bg-slate-900/70 hover:bg-slate-900 border border-slate-800/80 hover:border-blue-500/40 rounded-lg p-2.5 cursor-pointer transition-colors">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${st.dot} shrink-0"></span>
                <span class="font-mono text-xs font-semibold text-blue-300">${esc(n.notamNo)}</span>
              </div>
              <span class="font-mono text-[10.5px] text-sky-300">${esc(n.upperLimit)}</span>
            </div>
            <div class="mt-1 text-xs text-slate-200 line-clamp-2 leading-snug">${esc(n.title)}</div>
            <div class="mt-1 font-mono text-[10px] text-slate-500 truncate">${esc(n.schedule)}</div>
          </div>
        `;
      }).join('');
    }

    function toggleMobileSidebar(force) {
      const el = document.getElementById('sidebar');
      const open = typeof force === 'boolean' ? force : el.classList.contains('-translate-x-full');
      el.classList.toggle('-translate-x-full', !open);
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(msg, tone = 'emerald') {
      const tones = {
        emerald: 'border-emerald-500/50 text-emerald-200',
        amber: 'border-amber-500/50 text-amber-200',
        red: 'border-rose-500/50 text-rose-200'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto bg-slate-950/95 border ${tones[tone] || tones.emerald} px-3 py-2 rounded-lg shadow-xl text-xs transition-opacity duration-300`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    function updateClock() {
      const hkt = getNowHKT();
      document.getElementById('hktClock').textContent = `${hkt.hhmm} HKT`;
      document.getElementById('todayDateLabel').textContent = `${hkt.dateStr} HKT`;
    }

    function refreshAll() {
      renderNotamsOnMap();
      renderSidebarList();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      initMap();
      updateClock();
      refreshAll();
      fetchSeriesCNotams();

      setInterval(updateClock, 15000);
      setInterval(refreshAll, 60000);
    });
  </script>
</body>
</html>
